<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LearnBuddy – ESP32 Connection Diagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0c12; color:#eee; font-family:'Courier New',monospace; padding:16px; }
  h1 { text-align:center; color:#00e5c0; font-size:20px; margin-bottom:4px; letter-spacing:1px; }
  h2 { text-align:center; color:#6a8ab0; font-size:13px; font-weight:normal; margin-bottom:12px; }
  canvas { display:block; margin:0 auto; border-radius:6px; border:1px solid #1e2e48; }
  .legend { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin:10px 0 6px; font-size:12px; }
  .li { display:flex; align-items:center; gap:6px; }
  .ls { width:28px; height:4px; border-radius:2px; }
  .bg-bar { display:flex; justify-content:center; align-items:center; gap:10px; margin:8px 0; font-size:12px; }
  .bg-bar span { color:#6a8ab0; }
  .swatch { width:22px; height:22px; border-radius:4px; border:2px solid #333; cursor:pointer; transition:transform .15s; }
  .swatch:hover { transform:scale(1.2); border-color:#00e5c0; }
  .swatch.active { border-color:#00e5c0; box-shadow:0 0 6px #00e5c0; }
  #customBg { width:36px; height:26px; border:none; border-radius:4px; cursor:pointer; background:none; padding:0; }
</style>
</head>
<body>
<h1>LearnBuddy – ESP32 Hardware Connection Diagram</h1>
<h2>ESP32-WROOM-32 (38-pin) · 4×4 Matrix Keypad · WS2812B 16-LED Ring · Touch Channels</h2>

<div class="bg-bar">
  <span>Background:</span>
  <div class="swatch active" style="background:#0a0c12" data-color="#0a0c12" title="Black"></div>
  <div class="swatch" style="background:#0d1b2a" data-color="#0d1b2a" title="Dark Navy"></div>
  <div class="swatch" style="background:#1a1a2e" data-color="#1a1a2e" title="Dark Purple"></div>
  <div class="swatch" style="background:#1e1e1e" data-color="#1e1e1e" title="Dark Gray"></div>
  <div class="swatch" style="background:#2c2c2c" data-color="#2c2c2c" title="Gray"></div>
  <div class="swatch" style="background:#ffffff" data-color="#ffffff" title="White"></div>
  <div class="swatch" style="background:#f0f4f8" data-color="#f0f4f8" title="Light Gray"></div>
  <div class="swatch" style="background:#1a2f1a" data-color="#1a2f1a" title="Dark Green"></div>
  <input type="color" id="customBg" value="#0a0c12" title="Custom color">
  <span style="color:#4a6a8a">Custom</span>
</div>
<div class="legend">
  <div class="li"><div class="ls" style="background:#ff6b6b"></div>ROW outputs</div>
  <div class="li"><div class="ls" style="background:#5dade2"></div>COL inputs</div>
  <div class="li"><div class="ls" style="background:#58d68d"></div>WS2812B Data</div>
  <div class="li"><div class="ls" style="background:#c39bd3"></div>Touch (freed)</div>
  <div class="li"><div class="ls" style="background:#f5b041"></div>Power</div>
  <div class="li"><div class="ls" style="background:#aab7b8"></div>GND</div>
  <div class="li"><div class="ls" style="background:#e74c3c; opacity:.7"></div>⚠ Flash/Boot (avoid)</div>
</div>
<canvas id="c" width="1560" height="980"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ── Colors ────────────────────────────────────────────────────────────────────
const C = {
  bg    : '#0a0c12',
  mod   : '#0c1e36',
  modBd : '#1f6fad',
  row   : '#ff6b6b',
  col   : '#5dade2',
  led   : '#58d68d',
  pwr   : '#f5b041',
  gnd   : '#aab7b8',
  touch : '#c39bd3',
  tboot : '#9b59b6',
  flash : '#c0392b',
  inO   : '#7f8c8d',
  unused: '#8fa5b5',
  white : '#e8f0fa',
};

// ── Module geometry ───────────────────────────────────────────────────────────
const MX = 560, MY = 40, MW = 200, MH = 840;
const PINS = 19;
const PS   = MH / (PINS - 1);
const PY   = i => MY + i * PS;
const LSX  = MX - 20;           // left stub end x
const RSX  = MX + MW + 20;      // right stub end x
const LL   = LSX - 8;           // left label anchor
const RL   = RSX + 8;           // right label anchor

// ── Pin color lookup ──────────────────────────────────────────────────────────
const pc = t => ({
  row:C.row, col:C.col, led:C.led, pwr:C.pwr, gnd:C.gnd,
  touch:C.touch, tboot:C.tboot, flash:C.flash, inO:C.inO, unused:C.unused
}[t] || C.unused);

// ── LEFT rail (L0-L18, top→bottom) ───────────────────────────────────────────
// Keypad now uses left-rail GPIO21,22,23,19,5,17 (swapped from right-rail touch pins)
const LP = [
  { l:'GND',               t:'gnd'    },  // 0
  { l:'IO23 → COL0',       t:'col'    },  // 1  ★ keypad col0
  { l:'IO22 → ROW3',       t:'row'    },  // 2  ★ keypad row3
  { l:'IO1 / TXD0',        t:'unused' },  // 3
  { l:'IO3 / RXD0',        t:'unused' },  // 4
  { l:'IO21 → ROW2',       t:'row'    },  // 5  ★ keypad row2
  { l:'GND',               t:'gnd'    },  // 6
  { l:'IO19 → COL1',       t:'col'    },  // 7  ★ keypad col1
  { l:'IO18 → LED DATA',   t:'led'    },  // 8  ★ WS2812B
  { l:'IO5  → COL2',       t:'col'    },  // 9  ★ keypad col2
  { l:'IO17 → COL3',       t:'col'    },  // 10 ★ keypad col3
  { l:'IO16',              t:'unused' },  // 11
  { l:'IO4  [T0] ★ FREE',  t:'touch'  },  // 12
  { l:'IO0  [T1] ⚠ BOOT',  t:'tboot'  },  // 13
  { l:'IO2  [T2] ⚠ BOOT',  t:'tboot'  },  // 14
  { l:'IO15 [T3] ★ FREE',  t:'touch'  },  // 15
  { l:'SD1/IO8  ⚠ FLASH',  t:'flash'  },  // 16
  { l:'SD0/IO7  ⚠ FLASH',  t:'flash'  },  // 17
  { l:'CLK/IO6  ⚠ FLASH',  t:'flash'  },  // 18
];

// ── RIGHT rail (R0-R18, top→bottom) ──────────────────────────────────────────
// GPIO32,33,27,14,12,13 are now FREE touch channels (keypad moved to left rail)
const RP = [
  { l:'3V3',               t:'pwr'    },  // 0
  { l:'EN / RESET',        t:'unused' },  // 1
  { l:'IO36/VP (in-only)', t:'inO'    },  // 2
  { l:'IO39/VN (in-only)', t:'inO'    },  // 3
  { l:'IO34    (in-only)', t:'inO'    },  // 4
  { l:'IO35    (in-only)', t:'inO'    },  // 5
  { l:'IO32 [T9] ★ FREE',  t:'touch'  },  // 6  freed!
  { l:'IO33 [T8] ★ FREE',  t:'touch'  },  // 7  freed!
  { l:'IO25 → ROW1',       t:'row'    },  // 8
  { l:'IO26 → ROW0',       t:'row'    },  // 9
  { l:'IO27 [T7] ★ FREE',  t:'touch'  },  // 10 freed!
  { l:'IO14 [T6] ★ FREE',  t:'touch'  },  // 11 freed!
  { l:'IO12 [T5] ★ FREE',  t:'touch'  },  // 12 freed!
  { l:'IO13 [T4] ★ FREE',  t:'touch'  },  // 13 freed!
  { l:'SD3/IO10 ⚠ FLASH',  t:'flash'  },  // 14
  { l:'SD2/IO9  ⚠ FLASH',  t:'flash'  },  // 15
  { l:'CMD/IO11 ⚠ FLASH',  t:'flash'  },  // 16
  { l:'5V / VIN',          t:'pwr'    },  // 17
  { l:'GND',               t:'gnd'    },  // 18
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function line(x1,y1,x2,y2,col,lw=2,dash=[]){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.lineCap='round'; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function poly(pts,col,lw=2.5,dash=[]){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.stroke(); ctx.restore();
}
function dot(x,y,r,fill){
  ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}
function rrect(x,y,w,h,fill,stroke,lw=1.5,r=5){
  ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.stroke();
}

// Text with opaque background so wires never bleed through labels
function txt(s, x, y, color, sz=10, align='left', bold=false){
  ctx.font = `${bold?'bold ':''}${sz}px "Courier New",monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  const w = ctx.measureText(s).width;
  const pad = 3;
  const bx = align==='right' ? x-w-pad : align==='center' ? x-w/2-pad : x-pad;
  ctx.fillStyle = 'rgba(8,10,18,0.88)';
  ctx.fillRect(bx, y-sz/2-pad, w+pad*2, sz+pad*2);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

// ── ESP32 module ──────────────────────────────────────────────────────────────
function drawESP32(){
  rrect(MX, MY, MW, MH, C.mod, C.modBd, 2, 8);

  // antenna
  rrect(MX+50, MY-28, 100, 28, '#08182e', C.modBd, 1.5, 3);
  txt('ANTENNA', MX+MW/2, MY-14, '#2e8fc8', 8.5, 'center');

  txt('ESP32-WROOM-32', MX+MW/2, MY+20, '#00e5c0', 13, 'center', true);
  txt('38-PIN DEVKIT', MX+MW/2, MY+36, '#2e8fc8', 10, 'center');
  txt('240 MHz · Dual-core · 520 KB SRAM', MX+MW/2, MY+52, '#3a5a78', 8.5, 'center');

  // USB stub
  rrect(MX+64, MY+MH-1, 72, 16, '#111828', '#4a5a6a', 1, 2);
  txt('USB', MX+MW/2, MY+MH+7, '#4a6a8a', 8, 'center');

  // LEFT pins
  LP.forEach((p,i)=>{
    const py = PY(i); const col = pc(p.t);
    const lw = (p.t==='unused'||p.t==='flash'||p.t==='inO') ? 1 : 2;
    line(MX, py, LSX, py, col, lw);
    dot(LSX, py, p.t==='unused'||p.t==='flash'||p.t==='inO' ? 2 : 3, col);
    txt(p.l, LL, py, col, 9.5, 'right');
  });

  // RIGHT pins
  RP.forEach((p,i)=>{
    const py = PY(i); const col = pc(p.t);
    const lw = (p.t==='unused'||p.t==='flash'||p.t==='inO') ? 1 : 2;
    line(MX+MW, py, RSX, py, col, lw);
    dot(RSX, py, p.t==='unused'||p.t==='flash'||p.t==='inO' ? 2 : 3, col);
    txt(p.l, RL, py, col, 9.5, 'left');
  });
}

// ── LED Ring ──────────────────────────────────────────────────────────────────
const RCX=195, RCY=413, RR=95;
function drawLEDRing(){
  txt('WS2812B  16-LED RING', RCX, RCY-RR-36, C.led, 12, 'center', true);
  txt('GPIO18 · RMT @ 10 MHz', RCX, RCY-RR-20, '#3a8a5a', 9, 'center');

  ctx.save();
  ctx.strokeStyle='#0e2a1a'; ctx.lineWidth=24;
  ctx.beginPath(); ctx.arc(RCX,RCY,RR,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#1a5a30'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(RCX,RCY,RR,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  const hues=[0,22,45,60,80,100,120,160,180,200,220,250,270,290,310,340];
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2-Math.PI/2;
    const lx=RCX+Math.cos(a)*RR, ly=RCY+Math.sin(a)*RR;
    ctx.fillStyle=`hsla(${hues[i]},100%,55%,0.55)`;
    ctx.strokeStyle=`hsl(${hues[i]},100%,70%)`;
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(lx,ly,7.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
    const lr=RR+20;
    txt(String(i),RCX+Math.cos(a)*lr,RCY+Math.sin(a)*lr,'#6a8a9a',7.5,'center');
  }
  txt('DIN', RCX, RCY-6, C.led, 9.5, 'center', true);
  txt('GPIO18', RCX, RCY+8, C.led, 9, 'center');

  // power stubs
  line(RCX, RCY-RR-4, RCX, RCY-RR-18, C.pwr, 1.5, [4,3]);
  txt('5V →', RCX+5, RCY-RR-11, C.pwr, 8.5, 'left');
  line(RCX, RCY+RR+4, RCX, RCY+RR+18, C.gnd, 1.5, [4,3]);
  txt('GND →', RCX+5, RCY+RR+11, C.gnd, 8.5, 'left');
}

// ── Keypad ────────────────────────────────────────────────────────────────────
const KX=1080, KY=185, KCW=70, KCH=60;
const KW=KCW*4, KH=KCH*4, KBY=KY+KH;
const rowCY = r => KY+r*KCH+KCH/2;
const colCX = c => KX+c*KCW+KCW/2;

function drawKeypad(){
  txt('4×4 MATRIX KEYPAD', KX+KW/2, KY-30, C.white, 13, 'center', true);
  txt('Rows: OUTPUT  ·  Cols: INPUT pull-down', KX+KW/2, KY-14, '#5a8ab0', 9, 'center');

  rrect(KX-10, KY-10, KW+20, KH+20, '#08141e', '#1f6fad', 1.5, 7);

  const keys=[['1','2','3','R'],['4','5','6','Y'],['7','8','9','O'],['SPC','0','.','G']];
  const cmap={R:['#4a1010','#ff6b6b'],Y:['#4a3e10','#f5c518'],
              O:['#4a2810','#f5a623'],G:['#0a3a14','#58d68d']};
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const x=KX+c*KCW, y=KY+r*KCH, k=keys[r][c];
      const isC=cmap[k];
      const [bg,fg]=isC?cmap[k]:['#0e1e2e','#e8f0fa'];
      rrect(x+3,y+3,KCW-6,KCH-6,bg,'#2a5a8a',1,4);
      txt(k, x+KCW/2, y+KCH/2, fg, k==='SPC'?10:13, 'center', true);
    }
  }

  // Row labels left of keypad
  const rGPIO=[26,25,21,22], rNote=['right','right','left','left'];
  for(let r=0;r<4;r++){
    const cy=rowCY(r);
    txt(`ROW${r}`, KX-60, cy-7, C.row, 9.5, 'right', true);
    txt(`GPIO${rGPIO[r]} (${rNote[r]})`, KX-60, cy+7, '#d08080', 8.5, 'right');
    dot(KX-10, cy, 4, C.row);
    line(KX-10, cy, KX, cy, C.row, 2);
  }

  // Col labels below keypad
  const cGPIO=[23,19,5,17], cNote=['left','left','left','left'];
  for(let c=0;c<4;c++){
    const cx=colCX(c);
    dot(cx, KBY+8, 4, C.col);
    line(cx, KBY+8, cx, KBY+20, C.col, 2);
    txt(`COL${c}`, cx, KBY+32, C.col, 9.5, 'center', true);
    txt(`GPIO${cGPIO[c]}`, cx, KBY+46, '#80aad0', 8.5, 'center');
    txt('(left rail)', cx, KBY+58, '#3a6080', 8, 'center');
  }
}

// ── Wires ─────────────────────────────────────────────────────────────────────
function drawWires(){
  // LED data: IO18 (L8) → ring right edge
  const ledY=PY(8);
  poly([[LSX,ledY],[360,ledY],[360,RCY],[RCX+RR+6,RCY]], C.led, 3);
  ctx.fillStyle=C.led;
  ctx.beginPath(); ctx.moveTo(RCX+RR+4,RCY);
  ctx.lineTo(RCX+RR+14,RCY-5); ctx.lineTo(RCX+RR+14,RCY+5); ctx.fill();

  // ROW0 (GPIO26, R9) and ROW1 (GPIO25, R8) → direct right rail to keypad
  // These two rows are on the right rail, easy direct connection
  const rowRight=[{ri:9,kr:0},{ri:8,kr:1}];
  const rxRoute=[810,805];
  rowRight.forEach(({ri,kr},idx)=>{
    const py=PY(ri), ky=rowCY(kr), rx=rxRoute[idx];
    poly([[RSX,py],[rx,py],[rx,ky],[KX-10,ky]], C.row, 2.5);
  });

  // ROW2 (GPIO21, L5) and ROW3 (GPIO22, L2) → left rail, route BELOW module
  const rowLeft=[
    {li:5, kr:2, byOff:0},   // ROW2 GPIO21
    {li:2, kr:3, byOff:12},  // ROW3 GPIO22
  ];
  const modBottom = MY+MH+30;
  rowLeft.forEach(({li,kr,byOff})=>{
    const py=PY(li), ky=rowCY(kr), by=modBottom+byOff;
    const cx=colCX(2)+40+byOff;   // route right below module
    poly([[LSX,py],[380+byOff,py],[380+byOff,by],[cx,by],[cx,ky],[KX-10,ky]], C.row, 2.5);
  });

  // COL0-3 (GPIO23,19,5,17 all left rail) → route below module to keypad bottom
  const colLeft=[
    {li:1, kc:0, byOff:28},  // COL0 GPIO23
    {li:7, kc:1, byOff:42},  // COL1 GPIO19
    {li:9, kc:2, byOff:56},  // COL2 GPIO5
    {li:10,kc:3, byOff:70},  // COL3 GPIO17
  ];
  colLeft.forEach(({li,kc,byOff})=>{
    const py=PY(li), cx=colCX(kc), by=modBottom+byOff;
    poly([[LSX,py],[360+byOff,py],[360+byOff,by],[cx,by],[cx,KBY+8]], C.col, 2.5);
  });
}

// ── Touch channel summary (right side) ────────────────────────────────────────
function drawTouchSummary(){
  const bx=810, by=620, bw=250, bh=200;
  rrect(bx,by,bw,bh,'#100820','#8e44ad',1.5,6);
  txt('★  TOUCH CHANNELS FREED  ★', bx+bw/2, by+14, C.touch, 10, 'center', true);
  txt('(keypad moved to left rail)', bx+bw/2, by+27, '#6a4a8a', 8.5, 'center');

  const freed=[
    ['T4','GPIO13','★ safe'],['T5','GPIO12','★ safe'],
    ['T6','GPIO14','★ safe'],['T7','GPIO27','★ safe'],
    ['T8','GPIO33','★ safe'],['T9','GPIO32','★ safe'],
  ];
  freed.forEach(([t,g,note],i)=>{
    txt(`${t}  ${g}  ${note}`, bx+14, by+47+i*24, C.touch, 9, 'left');
  });

  txt('Already free:', bx+14, by+200-56, '#5a4a6a', 8.5, 'left');
  txt('T0 GPIO4   T3 GPIO15  ★ safe', bx+14, by+200-42, C.touch, 8.5, 'left');
  txt('T1 GPIO0   T2 GPIO2   ⚠ boot', bx+14, by+200-28, C.tboot, 8.5, 'left');
  txt('Total usable touch: 8 safe + 2 boot', bx+14, by+200-12, '#8a6aaa', 8, 'left');
}

// ── Notes ─────────────────────────────────────────────────────────────────────
function drawNotes(){
  const bx=1080, by=630, bw=460, bh=200;
  rrect(bx,by,bw,bh,'#081408','#2e7d32',1.5,6);
  txt('FIRMWARE NOTES', bx+10, by+14, '#58d68d', 10, 'left', true);
  const lines=[
    '• Keypad ROW2/ROW3 wired from LEFT rail of DevKit',
    '• Keypad COL0-COL3 wired from LEFT rail of DevKit',
    '• ROW0/ROW1 still on RIGHT rail (GPIO26/25)',
    '• Game 1: count LEDs (0-9 keys)  Game 2: colour match',
    '• Brightness: key 0 cycles 4 levels  Key SPC: pick game',
    '• WiFi AP: SSID LeanBuddy  PW 12345678',
    '• WebSocket ws://192.168.4.1/ws  messages: KEY_x',
    '• WS2812B: 300Ω series resistor on DIN recommended',
    '• Touch: 8 clean channels ready for next game module',
  ];
  lines.forEach((l,i)=>txt(l,bx+10,by+34+i*18,'#80c880',8.5,'left'));
}

// ── Background color picker ───────────────────────────────────────────────────
document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click',()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    C.bg = sw.dataset.color;
    document.body.style.background = C.bg;
    document.getElementById('customBg').value = C.bg;
    render();
  });
});
document.getElementById('customBg').addEventListener('input', e=>{
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  C.bg = e.target.value;
  document.body.style.background = C.bg;
  render();
});

// ── Render ─────────────────────────────────────────────────────────────────────
function render(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,cv.width,cv.height);

  // subtle grid
  ctx.strokeStyle='#12161e'; ctx.lineWidth=0.5;
  for(let x=0;x<cv.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke();}
  for(let y=0;y<cv.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}

  drawWires();
  drawLEDRing();
  drawESP32();
  drawKeypad();
  drawTouchSummary();
  drawNotes();
}
render();
</script>
</body>
</html>
