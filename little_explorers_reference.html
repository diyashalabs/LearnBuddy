<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Explorers Adventure</title>
<style>
  :root{
    --sky:#7ec8f2; --cream:#fff8ec; --sun:#ffcc4d; --leaf:#6fbf4f;
    --ink:#3a2b20; --pink:#ff6b9d; --blue:#4d96ff; --purple:#a17fe0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overflow:hidden; touch-action:none;}
  body{
    font-family:'Trebuchet MS','Comic Sans MS',ui-rounded,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#bfe4ff,#eaf7ff);
    color:var(--ink);
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  #canvasWrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  canvas#gameCanvas{display:block; background:#bfe4ff; border-radius:0; box-shadow:0 0 0 rgba(0,0,0,0);}

  .hidden{display:none !important;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit; font-weight:800; letter-spacing:0.5px;
    border:none; border-radius:20px; cursor:pointer;
    padding:16px 34px; font-size:22px; color:#fff;
    background:linear-gradient(180deg,#ffcf4d,#ff9f1c);
    box-shadow:0 6px 0 #d97e0a, 0 10px 18px rgba(0,0,0,0.2);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #d97e0a, 0 4px 10px rgba(0,0,0,0.2);}
  .btn.secondary{ background:linear-gradient(180deg,#7fd8ff,#3fa9f5); box-shadow:0 6px 0 #1f7fc9, 0 10px 18px rgba(0,0,0,0.2);}
  .btn.secondary:active{box-shadow:0 2px 0 #1f7fc9, 0 4px 10px rgba(0,0,0,0.2);}
  .btn.green{ background:linear-gradient(180deg,#8fe07a,#4fb43a); box-shadow:0 6px 0 #2e7a20, 0 10px 18px rgba(0,0,0,0.2);}
  .btn.green:active{box-shadow:0 2px 0 #2e7a20, 0 4px 10px rgba(0,0,0,0.2);}
  .btn.pink{ background:linear-gradient(180deg,#ff9ecb,#ff5c9d); box-shadow:0 6px 0 #c93a72, 0 10px 18px rgba(0,0,0,0.2);}
  .btn.pink:active{box-shadow:0 2px 0 #c93a72, 0 4px 10px rgba(0,0,0,0.2);}
  .btn.big{ font-size:26px; padding:20px 46px; }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(190,230,255,0.97), rgba(140,200,250,0.97));
    text-align:center; padding:20px;
  }
  .overlay.dim{ background:rgba(30,40,60,0.55); }
  .card-panel{
    background:#fff8ec; border-radius:28px; padding:28px 36px; max-width:92vw;
    box-shadow:0 14px 0 rgba(0,0,0,0.08), 0 20px 40px rgba(0,0,0,0.15);
    border:5px solid #ffe3a3;
  }
  h1.title{
    font-size:clamp(26px,5vw,44px); margin:0 0 6px; color:#ff6b3d;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.08);
  }
  h2.subtitle{ font-size:clamp(18px,3vw,26px); margin:0 0 20px; color:#3a6b2e; }

  /* ---------- Character Select ---------- */
  .char-cards{ display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
  .char-card{
    width:180px; background:linear-gradient(180deg,#ffffff,#fdf1d6);
    border-radius:22px; padding:14px 10px 18px; cursor:pointer;
    border:5px solid #ffe3a3; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 8px 0 rgba(0,0,0,0.06);
  }
  .char-card:hover{ transform:translateY(-4px); }
  .char-card.selected{
    border-color:#ff9f1c; transform:translateY(-8px) scale(1.04);
    box-shadow:0 0 0 6px rgba(255,204,77,0.5), 0 14px 24px rgba(255,159,28,0.35);
    animation:cardPop .5s ease;
  }
  @keyframes cardPop{ 0%{transform:scale(0.9) translateY(0);} 50%{transform:scale(1.08) translateY(-10px);} 100%{transform:translateY(-8px) scale(1.04);} }
  .char-card canvas{ display:block; margin:0 auto; }
  .char-card .name{ font-size:20px; font-weight:800; margin-top:6px; color:#3a2b20; }
  .char-card .sparkle{ font-size:13px; color:#ff9f1c; min-height:16px; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:10px; left:10px; right:10px; z-index:15;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-weight:800;
  }
  .hud-pill{
    background:rgba(255,255,255,0.88); border-radius:16px; padding:6px 14px;
    box-shadow:0 3px 0 rgba(0,0,0,0.1); font-size:16px; display:flex; gap:10px; align-items:center;
    border:2px solid #ffe3a3;
  }
  #hudWorld{ font-size:12px; color:#5a8f3f; display:block; text-align:center; margin-top:2px;}
  #pauseBtn{
    pointer-events:all; width:42px; height:42px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.9); font-size:20px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  #soundToggle{
    pointer-events:all; width:42px; height:42px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.9); font-size:18px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.15); margin-left:6px;
  }
  .hud-right{ display:flex; align-items:flex-start; }

  /* ---------- Message toast ---------- */
  #message{
    position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:16;
    background:#fff; border-radius:20px; padding:10px 24px; font-size:20px; font-weight:800;
    color:#ff6b3d; box-shadow:0 6px 14px rgba(0,0,0,0.2); border:3px solid #ffd66b;
    pointer-events:none;
  }
  #message.pop{ animation:msgPop .5s ease; }
  @keyframes msgPop{ 0%{transform:translateX(-50%) scale(0.5); opacity:0;} 60%{transform:translateX(-50%) scale(1.15);} 100%{transform:translateX(-50%) scale(1); opacity:1;} }

  /* ---------- Touch controls ---------- */
  #touchControls{ position:absolute; inset:0; z-index:14; pointer-events:none; display:none; }
  #touchControls.visible{ display:block; }
  .tbtn{
    position:absolute; pointer-events:all; border-radius:50%; border:none;
    background:rgba(255,255,255,0.55); box-shadow:0 4px 0 rgba(0,0,0,0.15);
    font-size:30px; display:flex; align-items:center; justify-content:center; color:#3a2b20;
  }
  #btnLeft{ left:18px; bottom:26px; width:74px; height:74px; }
  #btnRight{ left:100px; bottom:26px; width:74px; height:74px; }
  #btnJump{ right:22px; bottom:26px; width:92px; height:92px; background:rgba(255,204,77,0.75); font-size:22px; font-weight:800; }

  .stat-line{ font-size:22px; font-weight:800; margin:10px 0 22px; color:#3a6b2e; }
  .btn-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }

  @media (max-width:600px){
    .char-cards{ gap:14px; }
    .char-card{ width:150px; padding:10px 6px 14px; }
    h1.title{ font-size:26px; }
    .btn{ font-size:18px; padding:13px 24px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-pill">
        <span>⭐ <span id="hudStars">0</span></span>
        <span>🪙 <span id="hudCoins">0</span></span>
        <span id="hudHearts">❤️❤️❤️</span>
        <span id="hudWorld"></span>
      </div>
      <div class="hud-right">
        <button id="soundToggle">🔊</button>
        <button id="pauseBtn">⏸️</button>
      </div>
    </div>

    <div id="message" class="hidden"></div>

    <!-- Touch Controls -->
    <div id="touchControls">
      <button id="btnLeft" class="tbtn">◀</button>
      <button id="btnRight" class="tbtn">▶</button>
      <button id="btnJump" class="tbtn">JUMP</button>
    </div>

    <!-- Character Select -->
    <div id="screen-select" class="overlay">
      <div class="card-panel">
        <h1 class="title">LITTLE EXPLORERS</h1>
        <h2 class="subtitle">Choose Your Friend!</h2>
        <div class="char-cards">
          <div class="char-card selected" id="card-aarav">
            <canvas id="preview-aarav" width="160" height="190"></canvas>
            <div class="name">Aarav</div>
            <div class="sparkle">✨</div>
          </div>
          <div class="char-card" id="card-ananya">
            <canvas id="preview-ananya" width="160" height="190"></canvas>
            <div class="name">Ananya</div>
            <div class="sparkle">✨</div>
          </div>
        </div>
        <button id="playBtn" class="btn big">PLAY ADVENTURE 🎉</button>
        <div style="margin-top:14px;">
          <button id="soundToggleSelect" class="btn secondary" style="font-size:15px; padding:8px 18px;">🔊 Sound</button>
        </div>
      </div>
    </div>

    <!-- Pause -->
    <div id="screen-pause" class="overlay dim hidden">
      <div class="card-panel">
        <h1 class="title" style="color:#4d96ff;">PAUSED</h1>
        <div class="btn-row" style="margin-top:16px;">
          <button id="resumeBtn" class="btn green">RESUME ▶️</button>
          <button id="restartBtn" class="btn secondary">RESTART 🔁</button>
          <button id="homeBtn" class="btn pink">HOME 🏠</button>
        </div>
      </div>
    </div>

    <!-- Level Complete -->
    <div id="screen-levelcomplete" class="overlay hidden">
      <div class="card-panel">
        <h1 class="title" id="lcTitle">GREAT JOB! 🎉</h1>
        <div class="stat-line" id="lcStats">⭐ 0   🪙 0</div>
        <button id="nextBtn" class="btn big">NEXT ADVENTURE ➡️</button>
      </div>
    </div>

    <!-- Game Complete -->
    <div id="screen-gamecomplete" class="overlay hidden">
      <div class="card-panel">
        <h1 class="title">YOU DID IT! 🏆🎉</h1>
        <h2 class="subtitle">All adventures complete!</h2>
        <div class="stat-line" id="gcStats">⭐ 0   🪙 0</div>
        <div class="btn-row">
          <button id="gcPlayAgainBtn" class="btn green">PLAY AGAIN 🔁</button>
          <button id="gcHomeBtn" class="btn secondary">HOME 🏠</button>
        </div>
      </div>
    </div>

    <!-- Game Over (symbolic) -->
    <div id="screen-gameover" class="overlay hidden">
      <div class="card-panel">
        <h1 class="title" style="color:#a17fe0;">Let's have another adventure!</h1>
        <div class="stat-line" id="goStats">⭐ 0   🪙 0</div>
        <button id="goPlayAgainBtn" class="btn big">PLAY AGAIN 🔁</button>
      </div>
    </div>

  </div>
</div>
<script>
/* ============================================================
   LITTLE EXPLORERS ADVENTURE — REFERENCE FILE
   Original keyboard/touch controls preserved for reference.
   IR sensor integration to be added in the game version.
   ============================================================ */

/* ---------------- Utility ---------------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function randRange(rng, a, b) { return a + rng() * (b - a); }
function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const LOGICAL_W = 960;
const LOGICAL_H = 540;
const GRAVITY = 1500;
const TERMINAL_VY = 950;

/* ---------------- Audio Manager ---------------- */
class AudioManager {
  constructor() { this.ctx = null; this.enabled = true; this.padNodes = null; }
  ensureCtx() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  setEnabled(v) { this.enabled = v; if (!v && this.padNodes) this.stopPad(); if (v) this.ensureCtx(); }
  tone(freq, dur, type, vol, delay, glideTo) {
    if (!this.enabled) return; this.ensureCtx(); if (!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(this.ctx.destination); osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  playJump() { this.tone(440, 0.18, 'triangle', 0.18, 0, 720); }
  playLand() { this.tone(180, 0.12, 'sine', 0.15, 0, 120); }
  playCoin() { this.tone(880, 0.09, 'square', 0.12, 0); this.tone(1318, 0.14, 'square', 0.12, 0.06); }
  playStar() { this.tone(660, 0.1, 'triangle', 0.15, 0); this.tone(990, 0.1, 'triangle', 0.15, 0.07); this.tone(1320, 0.18, 'triangle', 0.15, 0.14); }
  playHeart() { this.tone(523, 0.12, 'sine', 0.16, 0); this.tone(659, 0.16, 'sine', 0.16, 0.08); }
  playBounce() { this.tone(300, 0.12, 'sawtooth', 0.12, 0, 500); }
  playBump() { this.tone(150, 0.15, 'sawtooth', 0.14, 0, 90); }
  playStomp() { this.tone(220, 0.1, 'square', 0.15, 0, 80); this.tone(500, 0.08, 'sine', 0.1, 0.05); }
  playPowerup() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.16, i * 0.06)); }
  playBlock() { this.tone(700, 0.08, 'square', 0.12, 0, 900); }
  playClick() { this.tone(600, 0.06, 'sine', 0.1, 0); }
  playLevelComplete() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.18, i * 0.09)); }
  playGoal() { [392, 523, 659, 784, 988, 1318].forEach((f, i) => this.tone(f, 0.25, 'sine', 0.16, i * 0.08)); }
  startPad(theme) {
    if (!this.enabled) return; this.ensureCtx(); if (!this.ctx) return; this.stopPad();
    const base = theme === 'sky' ? 196 : theme === 'village' ? 220 : 174;
    const osc1 = this.ctx.createOscillator(); const osc2 = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc1.type = 'sine'; osc2.type = 'sine'; osc1.frequency.value = base; osc2.frequency.value = base * 1.5;
    gain.gain.value = 0.02; osc1.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
    osc1.start(); osc2.start(); this.padNodes = { osc1, osc2, gain };
  }
  stopPad() {
    if (this.padNodes) {
      try { this.padNodes.gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.3); this.padNodes.osc1.stop(this.ctx.currentTime + 0.35); this.padNodes.osc2.stop(this.ctx.currentTime + 0.35); } catch (e) {}
      this.padNodes = null;
    }
  }
}

/* ---------------- Input Manager ---------------- */
class InputManager {
  constructor() {
    this.left = false; this.right = false; this.jump = false; this.jumpPressed = false;
    this.pausePressed = false; this._jumpHeldPrev = false;
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
  }
  onKey(e, down) {
    const k = e.key.toLowerCase();
    if (['arrowleft', 'a'].includes(k)) { this.left = down; e.preventDefault(); }
    if (['arrowright', 'd'].includes(k)) { this.right = down; e.preventDefault(); }
    if (['arrowup', 'w', ' ', 'spacebar'].includes(k)) { this.jump = down; e.preventDefault(); }
    if (down && k === 'escape') this.pausePressed = true;
  }
  update() { this.jumpPressed = this.jump && !this._jumpHeldPrev; this._jumpHeldPrev = this.jump; }
  consumePause() { const v = this.pausePressed; this.pausePressed = false; return v; }
}

/* ---------------- Particle System ---------------- */
class ParticleSystem {
  constructor() { this.particles = []; }
  spawnSparkle(x, y, color, count) {
    count = count || 8;
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const spd = 60 + Math.random() * 90;
      this.particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 40, life: 0.5 + Math.random() * 0.3, age: 0, color: color || '#ffd54a', size: 3 + Math.random() * 3, type: 'spark', grav: 300 });
    }
  }
  spawnConfetti(x, y, count) {
    count = count || 30;
    const colors = ['#ff6b6b', '#ffd93d', '#6bcB77', '#4d96ff', '#ff9ecb', '#c39bff'];
    for (let i = 0; i < count; i++) {
      this.particles.push({ x: x + (Math.random() - 0.5) * 200, y: y - Math.random() * 60, vx: (Math.random() - 0.5) * 120, vy: -200 - Math.random() * 150, life: 1.4 + Math.random() * 0.8, age: 0, color: colors[(Math.random() * colors.length) | 0], size: 5 + Math.random() * 4, type: 'confetti', grav: 260, rot: Math.random() * Math.PI, rotSpd: (Math.random() - 0.5) * 8 });
    }
  }
  spawnPuff(x, y, color) {
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      this.particles.push({ x, y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 - 20, life: 0.4, age: 0, color: color || '#ffffff', size: 6 + Math.random() * 4, type: 'puff', grav: 0 });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i]; p.age += dt;
      if (p.age >= p.life) { this.particles.splice(i, 1); continue; }
      p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.rot !== undefined) p.rot += p.rotSpd * dt;
    }
  }
  render(ctx, camX) {
    for (const p of this.particles) {
      const t = 1 - p.age / p.life; ctx.save(); ctx.globalAlpha = clamp(t, 0, 1);
      const sx = p.x - camX, sy = p.y;
      if (p.type === 'confetti') { ctx.translate(sx, sy); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); }
      else if (p.type === 'puff') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(sx, sy, p.size * (1 + p.age * 2), 0, Math.PI * 2); ctx.fill(); }
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }
}

/* ---------------- Character Drawing ---------------- */
function drawCharacter(ctx, cx, cy, scale, character, state, time, facing, powerGlow) {
  const isBoy = character === 'aarav';
  const skin = '#f0b98a'; const hair = isBoy ? '#2b1b12' : '#241408';
  const shirt = '#ffffff'; const bottom = isBoy ? '#2b3a67' : '#e85d75';
  const shoeColor = isBoy ? '#3b3b3b' : '#7a3b3b'; const bagColor = isBoy ? '#3f7fbf' : '#ff9f43';
  let bob = 0, legPhase = 0, armPhase = 0, squash = 1, stretch = 1, leanX = 0, leanY = 0, armUp = 0, tilt = 0;
  const t = time;
  if (state === 'idle') { bob = Math.sin(t * 2.2) * 2; }
  else if (state === 'walk') { legPhase = Math.sin(t * 8); armPhase = Math.sin(t * 8 + Math.PI); bob = Math.abs(Math.sin(t * 8)) * 3; }
  else if (state === 'run') { legPhase = Math.sin(t * 13); armPhase = Math.sin(t * 13 + Math.PI); bob = Math.abs(Math.sin(t * 13)) * 4; leanX = facing * 4; }
  else if (state === 'jump') { legPhase = -0.6; armPhase = -0.8; armUp = 0.5; stretch = 1.08; squash = 0.95; }
  else if (state === 'fall') { legPhase = 0.3; armPhase = 1.1; armUp = 0.7; stretch = 1.05; squash = 0.97; }
  else if (state === 'land') { squash = 1.25; stretch = 0.8; bob = -3; }
  else if (state === 'celebrate') { bob = Math.abs(Math.sin(t * 10)) * 8; armUp = 1.4; tilt = Math.sin(t * 10) * 0.12; }
  else if (state === 'collect') { armUp = 1.1; leanY = -2; }
  else if (state === 'bump') { leanX = -facing * 8; tilt = -facing * 0.15; }
  ctx.save(); ctx.translate(cx + leanX, cy + bob + leanY); ctx.scale(facing, 1); ctx.rotate(tilt); ctx.scale(scale * stretch, scale * (2 - stretch) * 0.5 + scale * 0.5 * squash);
  if (powerGlow) { ctx.save(); ctx.globalAlpha = 0.35 + Math.sin(t * 10) * 0.15; ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(0, -34, 40, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  ctx.fillStyle = bagColor; roundRectPath(ctx, -13, -52, 14, 22, 4); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; roundRectPath(ctx, -10, -48, 8, 5, 2); ctx.fill();
  drawLeg(ctx, -Math.sin(legPhase) * 7, shoeColor, bottom);
  drawArm(ctx, -armPhase, -armUp * 0.7, skin, shirt, true);
  ctx.fillStyle = shirt; roundRectPath(ctx, -11, -50, 22, 26, 8); ctx.fill();
  ctx.fillStyle = isBoy ? '#2b3a67' : '#e85d75'; ctx.fillRect(-11, -50, 22, 5);

function buildWorld(idx) {

  let x = 0; const groundH = 80;
  if (cfg.theme !== 'sky') {
    while (x < cfg.length - 300) {
      const segLen = randRange(rng, 160, 320);
      level.platforms.push({ x, y: cfg.groundY, w: segLen, h: groundH, type: 'ground' });
      let cx = x + 30;
      while (cx < x + segLen - 20) { if (rng() < 0.55) level.coins.push({ x: cx, y: cfg.groundY - 34, collected: false }); cx += 34; }
      if (rng() < 0.5) { const fw = randRange(rng, 90, 150); const fx = x + segLen * 0.3; const fy = cfg.groundY - randRange(rng, 110, 170); level.platforms.push({ x: fx, y: fy, w: fw, h: 26, type: 'float' }); if (rng() < 0.6) level.stars.push({ x: fx + fw / 2, y: fy - 26, collected: false }); else { let bx = fx + 10; while (bx < fx + fw - 10) { level.coins.push({ x: bx, y: fy - 26, collected: false }); bx += 30; } } }
      if (rng() < 0.35) level.blocks.push({ x: x + segLen * 0.55, y: cfg.groundY - 140, w: 34, h: 34, used: false, bounceT: 0, contains: rng() < 0.5 ? 'coins' : (rng() < 0.5 ? 'star' : 'balloon') });
      if (rng() < 0.12) level.hearts.push({ x: x + segLen * 0.7, y: cfg.groundY - 40, collected: false });
      if (rng() < 0.1) { const kinds = ['superstar', 'rainbowheart', 'balloon']; level.powerups.push({ x: x + segLen * 0.45, y: cfg.groundY - 50, kind: kinds[(rng() * kinds.length) | 0], collected: false }); }

      let cx = x + 16; while (cx < x + pw - 10) { if (rng() < 0.6) level.coins.push({ x: cx, y: py - 30, collected: false }); cx += 30; }
      if (rng() < 0.4) level.stars.push({ x: x + pw / 2, y: py - 60, collected: false });
      if (rng() < 0.2) level.hearts.push({ x: x + pw * 0.6, y: py - 34, collected: false });
      if (rng() < 0.12) { const kinds = ['superstar', 'rainbowheart', 'balloon']; level.powerups.push({ x: x + pw * 0.4, y: py - 40, kind: kinds[(rng() * kinds.length) | 0], collected: false }); }

}

    if (!lvl.goal.reached && p.x > lvl.goal.x - 30) { lvl.goal.reached = true; this.onGoalReached(); }
  }
  onGoalReached() { this.state = 'LEVEL_COMPLETE'; this.audio.playGoal(); this.particles.spawnConfetti(this.player.x - this.camX, LOGICAL_H * 0.4, 40); this.player.celebrating = 999; this.unlockedWorld = Math.max(this.unlockedWorld, this.worldIndex + 1); localStorage.setItem('littleExplorers_unlockedWorld', String(this.unlockedWorld)); const total = this.score.stars * 10 + this.score.coins * 2; if (total > this.highScore) { this.highScore = total; localStorage.setItem('littleExplorers_highScore', String(this.highScore)); } setTimeout(() => { this.ui.showLevelComplete(); }, 900); }
  triggerGameOver() { this.state = 'GAME_OVER'; this.audio.stopPad(); this.ui.updateHUD(); setTimeout(() => { this.ui.els.goStats.textContent = `⭐ ${this.score.stars}   🪙 ${this.score.coins}`; this.ui.showGameOver(); }, 400); }
  togglePause() { if (this.state === 'PLAYING') { this.state = 'PAUSED'; this.ui.showPause(); this.audio.stopPad(); } else if (this.state === 'PAUSED') { this.state = 'PLAYING'; this.ui.hidePause(); this.audio.startPad(this.level.theme); } }
  render() {
    const ctx = this.ctx; ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
    if (this.state === 'CHARACTER_SELECT' || this.state === 'GAME_COMPLETE') return;
    const lvl = this.level; if (!lvl) return; const t = this.time;
    drawSkyBackground(ctx, lvl.theme, this.camX, t, LOGICAL_W, LOGICAL_H);
    for (const d of lvl.decorations) { if (d.layer !== 'back') continue; const sx = d.x - this.camX * 0.6; if (sx < -60 || sx > LOGICAL_W + 60) continue; this.renderDecoration(d, sx, t); }
    for (const p of lvl.platforms) { const sx = p.x - this.camX; if (sx + p.w < -20 || sx > LOGICAL_W + 20) continue; drawPlatform(ctx, { x: sx, y: p.y, w: p.w, h: p.h }, lvl.theme); }
    for (const d of lvl.decorations) { if (d.layer !== 'front') continue; const sx = d.x - this.camX; if (sx < -60 || sx > LOGICAL_W + 60) continue; this.renderDecoration(d, sx, t); }
    for (const b of lvl.blocks) { const sx = b.x - this.camX; if (sx < -50 || sx > LOGICAL_W + 50) continue; drawQuestionBlock(ctx, sx, b.y, b.w, b.h, Math.sin(b.bounceT * Math.PI) * 8, b.used, t); }
    for (const c of lvl.coins) { const sx = c.x - this.camX; if (sx > -20 && sx < LOGICAL_W + 20) drawCoin(ctx, sx, c.y, t + c.x * 0.01, c.collected); }
    for (const s of lvl.stars) { const sx = s.x - this.camX; if (sx > -20 && sx < LOGICAL_W + 20) drawStarItem(ctx, sx, s.y, t + s.x * 0.01, s.collected); }
    for (const h of lvl.hearts) { const sx = h.x - this.camX; if (sx > -20 && sx < LOGICAL_W + 20) drawHeartItem(ctx, sx, h.y, t + h.x * 0.01, h.collected); }
    for (const pu of lvl.powerups) { const sx = pu.x - this.camX; if (sx > -20 && sx < LOGICAL_W + 20) drawPowerUp(ctx, sx, pu.y, t, pu.kind, pu.collected); }
    const gsx = lvl.goal.x - this.camX;
    if (gsx > -220 && gsx < LOGICAL_W + 220) { if (lvl.goal.type === 'gate') drawGardenGate(ctx, gsx, lvl.goal.y, 1); else if (lvl.goal.type === 'school') drawSchoolBuilding(ctx, gsx, lvl.goal.y, 1); else drawCastle(ctx, gsx, lvl.goal.y, 1, t); }
    for (const e of lvl.enemies) { if (!e.alive) continue; const sx = e.x - this.camX; if (sx < -40 || sx > LOGICAL_W + 40) continue; drawEnemy(ctx, sx, e.y, 1, e.state, e.stateT + e.x * 0.01, e.dir); }
    const p = this.player; const psx = p.x - this.camX;
    ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(psx, this.groundBelow(p), 16, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    let pState = p.state; if (p.celebrating > 0) pState = 'celebrate';
    if (p.invuln > 0.6) { ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(t * 30) * 0.5; }
    drawCharacter(ctx, psx, p.bottom, 1, p.character, pState, p.animTime, p.facing, p.speedBoostTimer > 0);
    if (p.invuln > 0.6) ctx.restore();
    this.particles.render(ctx, this.camX);
  }
  groundBelow(p) { let best = p.bottom + 200; for (const plat of this.level.platforms) { if (p.x > plat.x && p.x < plat.x + plat.w && plat.y >= p.bottom - 2) best = Math.min(best, plat.y); } return best === p.bottom + 200 ? p.bottom : best; }
  renderDecoration(d, sx, t) { const ctx = this.ctx; const wob = Math.sin(t * 0.8 + d.phase) * 0.05; switch (d.type) { case 'cloud': drawCloudShape(ctx, sx, d.y, d.s); break; case 'tree': drawTree(ctx, sx, d.y, d.s, wob); break; case 'bush': drawBush(ctx, sx, d.y, d.s); break; case 'flower': drawFlower(ctx, sx, d.y, d.s, d.color, Math.sin(t * 2 + d.phase) * 0.15); break; case 'mushroom': drawMushroom(ctx, sx, d.y, d.s); break; case 'rock': drawRock(ctx, sx, d.y, d.s); break; case 'fence': drawFencePost(ctx, sx, d.y, d.s); break; case 'house': drawHouse(ctx, sx, d.y, d.s, d.colorIdx % 2 ? '#c94f4f' : '#4d96ff', d.colorIdx % 2 ? '#fff3d6' : '#ffe9c9'); break; case 'butterfly': drawButterfly(ctx, sx, d.y + Math.sin(t * 1.4 + d.phase) * 10, d.s, t + d.phase, d.colorIdx); break; case 'bird': drawBird(ctx, sx + Math.sin(t * 0.5) * 20, d.y, d.s, t + d.phase); break; case 'balloon': drawBalloonDecor(ctx, sx, d.y + Math.sin(t * 1.1 + d.phase) * 8, d.s, d.color); break; case 'kite': drawKite(ctx, sx, d.y, d.s, t + d.phase); break; } }
  loop(now) { let dt = (now - this.lastFrame) / 1000; dt = Math.min(dt, 0.033); this.lastFrame = now; this.time += dt; this.update(dt); this.particles.update(dt); this.render(); requestAnimationFrame((t) => this.loop(t)); }
}

class UIManager {
  constructor(game) {
    this.game = game;
    this.els = { select: document.getElementById('screen-select'), hud: document.getElementById('hud'), message: document.getElementById('message'), pause: document.getElementById('screen-pause'), levelComplete: document.getElementById('screen-levelcomplete'), gameComplete: document.getElementById('screen-gamecomplete'), gameOver: document.getElementById('screen-gameover'), touchControls: document.getElementById('touchControls'), pauseBtn: document.getElementById('pauseBtn'), soundToggle: document.getElementById('soundToggle'), soundToggleSelect: document.getElementById('soundToggleSelect'), hudStars: document.getElementById('hudStars'), hudCoins: document.getElementById('hudCoins'), hudHearts: document.getElementById('hudHearts'), hudWorld: document.getElementById('hudWorld'), selCards: { aarav: document.getElementById('card-aarav'), ananya: document.getElementById('card-ananya') }, playBtn: document.getElementById('playBtn'), lcTitle: document.getElementById('lcTitle'), lcStats: document.getElementById('lcStats'), nextBtn: document.getElementById('nextBtn'), gcStats: document.getElementById('gcStats'), goStats: document.getElementById('goStats') };
    this.previewCanvases = { aarav: document.getElementById('preview-aarav').getContext('2d'), ananya: document.getElementById('preview-ananya').getContext('2d') };
    this.selected = game.character; this.bindEvents(); this.updateSoundToggles(); this.detectTouch(); this.startPreviewLoop();
  }
  detectTouch() { const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia('(pointer: coarse)').matches; if (isTouch) this.els.touchControls.classList.add('visible'); }
  bindEvents() {
    const g = this.game;
    this.els.selCards.aarav.addEventListener('click', () => this.selectCharacter('aarav'));
    this.els.selCards.ananya.addEventListener('click', () => this.selectCharacter('ananya'));
    this.els.playBtn.addEventListener('click', () => { g.audio.ensureCtx(); g.audio.playClick(); g.character = this.selected; localStorage.setItem('littleExplorers_character', this.selected); this.hideSelect(); g.startWorld(0); });
    this.els.pauseBtn.addEventListener('click', () => { g.audio.playClick(); g.togglePause(); });
    document.getElementById('resumeBtn').addEventListener('click', () => { g.audio.playClick(); g.togglePause(); });
    document.getElementById('restartBtn').addEventListener('click', () => { g.audio.playClick(); this.hidePause(); g.startWorld(g.worldIndex); });
    document.getElementById('homeBtn').addEventListener('click', () => { g.audio.playClick(); this.hidePause(); g.audio.stopPad(); g.state = 'CHARACTER_SELECT'; this.hideHUD(); this.showSelect(); });
    this.els.nextBtn.addEventListener('click', () => { g.audio.playClick(); this.hideLevelComplete(); g.nextWorld(); });
    document.getElementById('gcHomeBtn').addEventListener('click', () => { g.audio.playClick(); this.hideGameComplete(); g.state = 'CHARACTER_SELECT'; this.showSelect(); });
    document.getElementById('gcPlayAgainBtn').addEventListener('click', () => { g.audio.playClick(); this.hideGameComplete(); g.startWorld(0); });
    document.getElementById('goPlayAgainBtn').addEventListener('click', () => { g.audio.playClick(); this.hideGameOver(); g.startWorld(g.worldIndex); });
    [this.els.soundToggle, this.els.soundToggleSelect].forEach(btn => { btn.addEventListener('click', () => { g.soundOn = !g.soundOn; g.audio.setEnabled(g.soundOn); localStorage.setItem('littleExplorers_sound', g.soundOn ? 'on' : 'off'); this.updateSoundToggles(); if (g.soundOn) g.audio.playClick(); if (g.state === 'PLAYING' && g.soundOn) g.audio.startPad(g.level.theme); }); });
    const bindHold = (id, onDown, onUp) => { const el = document.getElementById(id); const down = (e) => { e.preventDefault(); onDown(); }; const up = (e) => { e.preventDefault(); onUp(); }; el.addEventListener('touchstart', down, { passive: false }); el.addEventListener('touchend', up, { passive: false }); el.addEventListener('touchcancel', up, { passive: false }); el.addEventListener('mousedown', down); el.addEventListener('mouseup', up); el.addEventListener('mouseleave', up); };
    bindHold('btnLeft', () => g.input.left = true, () => g.input.left = false);
    bindHold('btnRight', () => g.input.right = true, () => g.input.right = false);
    bindHold('btnJump', () => g.input.jump = true, () => g.input.jump = false);
  }
  selectCharacter(name) { this.selected = name; this.game.audio.ensureCtx(); this.game.audio.playClick(); this.els.selCards.aarav.classList.toggle('selected', name === 'aarav'); this.els.selCards.ananya.classList.toggle('selected', name === 'ananya'); }
  startPreviewLoop() { const loop = (now) => { const t = now / 1000; for (const key of ['aarav', 'ananya']) { const ctx = this.previewCanvases[key]; ctx.clearRect(0, 0, 160, 190); ctx.save(); drawCharacter(ctx, 80, 150, 1.6, key, 'idle', t, 1, false); ctx.restore(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  updateSoundToggles() { const label = this.game.soundOn ? '🔊' : '🔇'; this.els.soundToggle.textContent = label; this.els.soundToggleSelect.textContent = label + ' Sound'; }
  showSelect() { this.els.select.classList.remove('hidden'); this.selectCharacter(this.selected); }
  hideSelect() { this.els.select.classList.add('hidden'); }
  showHUD() { this.els.hud.classList.remove('hidden'); this.els.pauseBtn.classList.remove('hidden'); }
  hideHUD() { this.els.hud.classList.add('hidden'); this.els.pauseBtn.classList.add('hidden'); }
  updateHUD() { const g = this.game; this.els.hudStars.textContent = g.score.stars; this.els.hudCoins.textContent = g.score.coins; this.els.hudHearts.textContent = '❤️'.repeat(g.lives) + '🤍'.repeat(Math.max(0, 3 - g.lives)); this.els.hudWorld.textContent = g.level ? g.level.worldName.toUpperCase() : ''; }
  showMessage(text) { this.els.message.textContent = text; this.els.message.classList.remove('hidden'); this.els.message.classList.remove('pop'); void this.els.message.offsetWidth; this.els.message.classList.add('pop'); }
  hideMessage() { this.els.message.classList.add('hidden'); }
  showPause() { this.els.pause.classList.remove('hidden'); }
  hidePause() { this.els.pause.classList.add('hidden'); }
  showLevelComplete() { const g = this.game; this.els.lcTitle.textContent = 'GREAT JOB! 🎉'; this.els.lcStats.textContent = `⭐ ${g.score.stars}   🪙 ${g.score.coins}`; this.els.nextBtn.textContent = (g.worldIndex >= 2) ? 'FINISH ADVENTURE 🏆' : 'NEXT ADVENTURE ➡️'; this.els.levelComplete.classList.remove('hidden'); }
  hideLevelComplete() { this.els.levelComplete.classList.add('hidden'); }
  showGameComplete() { const g = this.game; this.hideHUD(); this.els.gcStats.textContent = `⭐ ${g.score.stars}   🪙 ${g.score.coins}   🏆 Best: ${g.highScore}`; this.els.gameComplete.classList.remove('hidden'); g.particles.spawnConfetti(LOGICAL_W / 2, LOGICAL_H * 0.3, 60); }
  hideGameComplete() { this.els.gameComplete.classList.add('hidden'); }
  showGameOver() { this.els.gameOver.classList.remove('hidden'); }
  hideGameOver() { this.els.gameOver.classList.add('hidden'); }
}

window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  const game = new Game(canvas);
  window.__game = game;
});
</script>
