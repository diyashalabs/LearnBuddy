<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roti Maker</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; }
body{ background:#2c1206; font-family:'Segoe UI',Tahoma,sans-serif; }
canvas{ display:block; width:100vw; height:100vh; }

.overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; }
.overlay.dim{ background:rgba(0,0,0,.6); }
.hidden{ display:none !important; }
.card{ background:linear-gradient(160deg,#fff8f0,#fff3e0); border-radius:28px; padding:26px 30px;
  max-width:480px; width:92%; text-align:center; box-shadow:0 24px 64px rgba(0,0,0,.45);
  max-height:94vh; overflow-y:auto; }

h1.title{ font-size:26px; font-weight:900; color:#7a2e00; margin-bottom:4px; }
.sub{ color:#888; font-size:.85rem; }

.btn{ font-family:inherit; font-weight:800; border:none; border-radius:18px; cursor:pointer;
  padding:12px 24px; font-size:16px; color:#fff;
  background:linear-gradient(180deg,#ff9f4d,#d96010);
  box-shadow:0 5px 0 #9a3c00,0 8px 18px rgba(0,0,0,.2);
  transition:transform .08s,box-shadow .08s; }
.btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #9a3c00; }
.btn.green{ background:linear-gradient(180deg,#8fe07a,#4fb43a); box-shadow:0 5px 0 #2e7a20; }
.btn.green:active{ box-shadow:0 2px 0 #2e7a20; }
.btn.blue{ background:linear-gradient(180deg,#7fd8ff,#3fa9f5); box-shadow:0 5px 0 #1f7fc9; }
.btn.blue:active{ box-shadow:0 2px 0 #1f7fc9; }
.btn.big{ font-size:20px; padding:14px 36px; }
.btn.sm{ font-size:12px; padding:7px 13px; border-radius:12px; line-height:1.5; }
.btn.sel{ background:linear-gradient(180deg,#ff6b20,#b03800); box-shadow:0 5px 0 #702000; }
.btn.sel:active{ box-shadow:0 2px 0 #702000; }

.txt-input{ font-size:1rem; padding:9px 14px; border:2px solid #e0b080;
  border-radius:12px; background:#fff; font-family:inherit;
  width:100%; margin-top:6px; text-align:center; }
.txt-input:focus{ outline:none; border-color:#d96010; }

.opt-label{ font-size:.7rem; font-weight:700; color:#9a4800; text-transform:uppercase;
  letter-spacing:.07em; margin:14px 0 7px; }
.opt-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }

/* HUD */
#hud{ position:fixed; top:0; left:0; right:0; padding:10px 20px;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(30,10,0,.8); backdrop-filter:blur(6px); z-index:10; }
#hudTimer{ font-size:1.6rem; font-weight:900; color:#ffd54a; font-variant-numeric:tabular-nums; min-width:54px; }
#hudChef{ font-size:.82rem; color:#ffc080; font-weight:700; }
#hudRoti{ font-size:1.5rem; font-weight:900; color:#fff; }

/* roll progress bar */
#rollBar{ position:fixed; bottom:0; left:0; right:0; height:10px;
  background:rgba(0,0,0,.4); z-index:10; }
#rollFill{ height:100%; width:0%; background:linear-gradient(90deg,#ffb040,#ff5010);
  transition:width .12s ease-out; border-radius:0 5px 5px 0; }

/* sensor dots */
#sensorHUD{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; gap:28px; z-index:10; }
.sensor-dot{ width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.12);
  border:3px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center;
  font-size:.55rem; font-weight:900; color:rgba(255,255,255,.6); transition:all .1s; }
.sensor-dot.active{ background:#ffd54a; border-color:#ffa000; color:#3d1a0a; transform:scale(1.15); }

/* flying roti emoji */
.fly-emoji{ position:fixed; font-size:2.4rem; pointer-events:none; z-index:15;
  animation:flyUp 1.1s ease-out forwards; }
@keyframes flyUp{
  0%  { opacity:1; transform:translateY(0) scale(1); }
  70% { opacity:1; transform:translateY(-160px) scale(1.5); }
  100%{ opacity:0; transform:translateY(-210px) scale(1.2); }
}

/* result stats */
.stat-big{ font-size:3.2rem; font-weight:900; color:#d96010; margin:8px 0; }
</style>
</head>
<body>

<!-- CONNECT -->
<div id="scr-connect" class="overlay">

<!-- SETUP -->
<div id="scr-setup" class="overlay hidden">

<!-- RESULT -->

    <div style="font-size:.85rem;color:#aaa;margin-top:4px" id="resSub"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px">
      <button id="resAgainBtn" class="btn green">Cook Again 🔁</button>
      <button id="resHomeBtn" class="btn blue">Home 🏠</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ====================================================================
   ROTI MAKER — IR roller game for LearnBuddy
   S1 (left) and S2 (right) sense roller passes.
   Full back-and-forth (S1→S2→S1 or S2→S1→S2) = 1 roll.
   X rolls = 1 roti.  Dough grows from ball → flat roti as rolls add up.
   ==================================================================== */

const ROTI_TYPES=[
  {name:'Plain Roti',   emoji:'🫓', rolls:5 },
  {name:'Tandoori',     emoji:'🔥', rolls:10},
  {name:'Paratha',      emoji:'🥙', rolls:15},
  {name:'Custom',       emoji:'⚙️', rolls:0 },
];
const TIMER_OPTS=[30,60,120,180,240,300,360,420,480,540,600];
const DOUGH_CY_R = 0.65;  // dough center Y as fraction of canvas height
const BELAN_SPAN  = 72;   // total vertical travel of belan in px

const $=id=>document.getElementById(id);
function fmtTime(s){ const m=Math.floor(s/60),ss=s%60; return `${m}:${String(ss).padStart(2,'0')}`; }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(t){ return 1-(1-t)*(1-t); }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

/* ---------- Audio ---------- */
class AudioManager{
  constructor(){ this._ctx=null; this._en=true; }
  _ac(){
    if(!this._ctx) this._ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(this._ctx.state==='suspended') this._ctx.resume();
    return this._ctx;
  }
  ensureCtx(){ try{ this._ac(); }catch(_){} }
  _tone(freq,dur,type='sine',vol=0.3,atk=0.01){
    if(!this._en) return;
    try{
      const c=this._ac(),g=c.createGain(),o=c.createOscillator();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(vol,c.currentTime+atk);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+atk+dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+atk+dur+0.05);
    }catch(_){}
  }
  _noise(dur,vol=0.18,lo=300,hi=1200){
    if(!this._en) return;
    try{
      const c=this._ac(),buf=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),
        d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
      const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
      f.type='bandpass'; f.frequency.value=(lo+hi)/2; f.Q.value=0.6;
      g.gain.setValueAtTime(vol,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      src.buffer=buf; src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(); src.stop(c.currentTime+dur);
    }catch(_){}
  }
  playRoll(){ this._noise(0.14,0.22,400,1000); }
  playRotiDone(){
    this._tone(880,0.07,'sine',0.4,0.01);
    setTimeout(()=>this._tone(1320,0.12,'sine',0.35,0.01),90);
    setTimeout(()=>this._tone(1760,0.35,'sine',0.28,0.01),200);
  }
  playStart(){ this._tone(523,0.1,'triangle',0.3); setTimeout(()=>this._tone(659,0.18,'triangle',0.28),130); }
  playWarning(){ this._tone(440,0.12,'square',0.18); }
  playClick(){ this._tone(600,0.07,'triangle',0.2); }
  setEnabled(v){ this._en=v; }
}

/* ---------- RotiInput ---------- */
class RotiInput{
  constructor(){
    this._blockStart=[-Infinity,-Infinity];
    this._blocked=[false,false];
    this._lastSensor=-1;   // sensor roller was last seen at (0 or 1)
    this._transitions=0;   // direction changes; every 2 = 1 full roll
    this.onDirectionChange=null; // (toSensor:0|1) => void
    this.onFullRoll=null;        // () => void

    window.addEventListener('message',e=>{ if(e.data?.type==='ir') this._onIR({s:e.data.s,v:e.data.v}); });
    document.addEventListener('lb:ir',e=>{ const d=e.detail; this._onIR({s:d.s??d.sensor,v:d.v??d.value}); });
    window.addEventListener('keydown',e=>this._onKey(e));
  }
  _onIR({s,v}){
    const i=s-1, now=performance.now(), blocked=(v===0);
    if(blocked&&!this._blocked[i]) this._blockStart[i]=now;
    else if(!blocked&&this._blocked[i]){
      if(now-this._blockStart[i]<2000) this._sensorPassed(i); // ignore holds >2s
    }
    this._blocked[i]=blocked;
    const d1=$('s1dot'),d2=$('s2dot');
    if(d1) d1.classList.toggle('active',this._blocked[0]);
    if(d2) d2.classList.toggle('active',this._blocked[1]);
  }
  _sensorPassed(i){
    if(this._lastSensor===-1){ this._lastSensor=i; return; }
    if(i===this._lastSensor) return; // same sensor — ignore bounce
    this._lastSensor=i;
    this._transitions++;
    this.onDirectionChange?.(i);
    if(this._transitions>=2){ this._transitions=0; this.onFullRoll?.(); }
  }
  _onKey(e){
    const k=e.key.toLowerCase();
    if(['arrowleft','a'].includes(k)) this._sensorPassed(0);
    if(['arrowright','d'].includes(k)) this._sensorPassed(1);
  }
  reset(){ this._lastSensor=-1; this._transitions=0; }
}

/* ---------- Canvas ---------- */
function resizeCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}

/* ---------- Drawing ---------- */
function drawKitchen(ctx,W,H){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#b8703a'); g.addColorStop(1,'#7a3810');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // wood grain
  ctx.save(); ctx.globalAlpha=0.06; ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
  for(let y=-20;y<H+20;y+=22){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y+8); ctx.stroke();
  }
  // flour dust (static, seeded)
  ctx.globalAlpha=0.05; ctx.fillStyle='#fff';
  for(let i=0;i<120;i++){
    const fx=(Math.sin(i*43.7)*0.5+0.5)*W, fy=(Math.cos(i*27.3)*0.5+0.5)*H;
    ctx.beginPath(); ctx.arc(fx,fy,1+Math.abs(Math.sin(i)),0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawDough(ctx,cx,cy,progress,flashT){
  const p=clamp(progress,0,1), ep=easeOut(p);
  const r=lerp(24,105,ep);
  const sy=lerp(1.0,0.28,ep); // vertical squish: round ball → flat disc

  ctx.save(); ctx.translate(cx,cy);

  // shadow
  ctx.beginPath(); ctx.ellipse(5,8+r*sy*0.4,r*0.95,r*sy*0.5,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fill();

  // dough
  const gr=ctx.createRadialGradient(-r*0.28,-r*sy*0.3,r*0.04, 0,0,r*1.08);
  const light=`hsl(38,${Math.round(55+ep*20)}%,${Math.round(92-ep*14)}%)`;
  const mid  =`hsl(36,${Math.round(55+ep*20)}%,${Math.round(78-ep*12)}%)`;
  const dark =`hsl(34,${Math.round(58+ep*18)}%,${Math.round(52-ep*10)}%)`;
  gr.addColorStop(0,light); gr.addColorStop(0.45,mid); gr.addColorStop(1,dark);
  ctx.beginPath(); ctx.ellipse(0,0,r,r*sy,0,0,Math.PI*2);
  ctx.fillStyle=gr; ctx.fill();

  // edge burn (more rolled = browner edges)
  if(ep>0.15){
    const eg=ctx.createRadialGradient(0,0,r*(0.55-ep*0.15),0,0,r*1.02);
    eg.addColorStop(0,'rgba(0,0,0,0)');
    eg.addColorStop(1,`rgba(90,42,5,${ep*0.32})`);
    ctx.beginPath(); ctx.ellipse(0,0,r,r*sy,0,0,Math.PI*2);
    ctx.fillStyle=eg; ctx.fill();
  }

  // centre dimple (traditional roti look when nearly flat)
  if(ep>0.6){
    const dp=(ep-0.6)/0.4;
    ctx.beginPath(); ctx.ellipse(0,0,r*0.12,r*0.12*sy,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(120,65,10,${dp*0.4})`; ctx.fill();
  }

  // completion flash overlay
  if(flashT>0){
    ctx.beginPath(); ctx.ellipse(0,0,r*1.12,r*sy*1.12,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,230,120,${flashT*0.75})`; ctx.fill();
  }

  ctx.restore();
}

function drawBelan(ctx,cx,cy,animT,dir,span,hW){
  // Indian-style belan: thicker middle, smaller cylindrical ends.
  // Moves vertically: dir=1 → downward (toward S2), dir=-1 → upward (toward S1).
  const t=easeOut(clamp(animT,0,1));
  const by=dir>0 ? lerp(cy-span/2,cy+span/2,t) : lerp(cy+span/2,cy-span/2,t);

  // belan proportions (horizontal pin, viewed from above)
  const midH=21;   // half-height at widest middle
  const endH=9;    // end cap radius (smaller cylinders at both ends)
  const ei=endH;   // how far end-cap centres are inset from edges

  ctx.save(); ctx.translate(cx,by);

  // shadow (offset slightly)
  ctx.beginPath();
  ctx.moveTo(-hW+ei,-endH+5);
  ctx.bezierCurveTo(-hW*0.3,-midH*0.55+5, hW*0.3,-midH*0.55+5, hW-ei,-endH+5);
  ctx.arc(hW-ei,5,endH,-Math.PI/2,Math.PI/2);
  ctx.bezierCurveTo(hW*0.3,midH*0.55+5, -hW*0.3,midH*0.55+5, -hW+ei,endH+5);
  ctx.arc(-hW+ei,5,endH,Math.PI/2,-Math.PI/2);
  ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fill();

  // barrel outline: small end-caps + bezier curves that bulge out in the middle
  ctx.beginPath();
  ctx.moveTo(-hW+ei,-endH);
  ctx.bezierCurveTo(-hW*0.28,-midH*1.18, hW*0.28,-midH*1.18, hW-ei,-endH);
  ctx.arc(hW-ei,0,endH,-Math.PI/2,Math.PI/2);
  ctx.bezierCurveTo(hW*0.28,midH*1.18, -hW*0.28,midH*1.18, -hW+ei,endH);
  ctx.arc(-hW+ei,0,endH,Math.PI/2,-Math.PI/2);
  ctx.closePath();

  // wood gradient: light on top → dark on bottom (3D cylinder lighting)
  const gr=ctx.createLinearGradient(0,-midH,0,midH);
  gr.addColorStop(0,'#fff8ec');
  gr.addColorStop(0.18,'#ffe8a8');
  gr.addColorStop(0.62,'#c8a050');
  gr.addColorStop(1,'#8c6020');
  ctx.fillStyle=gr; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1.5; ctx.stroke();

  // highlight ridge along the upper bulge
  ctx.beginPath();
  ctx.moveTo(-hW*0.52,-midH*0.82);
  ctx.bezierCurveTo(-hW*0.18,-midH*1.12, hW*0.18,-midH*1.12, hW*0.52,-midH*0.82);
  ctx.strokeStyle='rgba(255,255,255,0.68)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();

  // end cap circles (darker wood, end-grain look)
  for(const ex of [-hW+ei, hW-ei]){
    const cg=ctx.createRadialGradient(ex-2,-2,1,ex,0,endH+3);
    cg.addColorStop(0,'#b88030'); cg.addColorStop(1,'#5a3408');
    ctx.beginPath(); ctx.arc(ex,0,endH,0,Math.PI*2);
    ctx.fillStyle=cg; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=1; ctx.stroke();
  }

  // subtle wood-grain lines on the barrel body
  ctx.save(); ctx.globalAlpha=0.07; ctx.strokeStyle='#3a2000'; ctx.lineWidth=1.2;
  for(let gx=-hW*0.62;gx<=hW*0.62;gx+=hW*0.22){
    const ratio=Math.max(0,1-(gx/(hW-ei))**2);
    const gy=midH*1.1*Math.sqrt(ratio);
    ctx.beginPath(); ctx.moveTo(gx,-gy*0.75); ctx.lineTo(gx,gy*0.75); ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
}

/* ---------- Flour Particles ---------- */
class FlourParticles{
  constructor(){ this.pts=[]; }
  puff(x,y,n=14){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=25+Math.random()*70;
      this.pts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,
        life:.5+Math.random()*.5,age:0,r:1.5+Math.random()*3});
    }
  }
  update(dt){
    for(let i=this.pts.length-1;i>=0;i--){
      const p=this.pts[i]; p.age+=dt;
      if(p.age>=p.life){this.pts.splice(i,1);continue;}
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=70*dt;
    }
  }
  draw(ctx){
    ctx.save();
    for(const p of this.pts){
      const a=(1-p.age/p.life)*0.75;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,250,240,${a})`; ctx.fill();
    }
    ctx.restore();
  }
}

function computeElbow(sx,sy,tx,ty,L1,L2,elbowLeft){
  const dx=tx-sx, dy=ty-sy;
  const D=Math.min(Math.sqrt(dx*dx+dy*dy), L1+L2-0.5);
  const ang=Math.atan2(dy,dx);
  const cosA=clamp((D*D+L1*L1-L2*L2)/(2*D*L1),-1,1);
  const a=Math.acos(cosA);
  const ea=elbowLeft?ang+a:ang-a;
  return [sx+L1*Math.cos(ea), sy+L1*Math.sin(ea)];
}

function drawChakla(ctx,cx,cy,r){
  ctx.save();
  const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.05,cx,cy,r);
  g.addColorStop(0,'#e8d098'); g.addColorStop(0.65,'#c8a050'); g.addColorStop(1,'#8c5c18');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#6a3c08'; ctx.lineWidth=5; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r-9,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}

/* ---------- Chef Animation ---------- */
class ChefAnim{
  constructor(isBoy){ this.isBoy=isBoy; this.lean=0; }
  onDir(dir){
    // dir=1 → pulling belan back → slight backward rock
    // dir=-1 → pushing belan away → lean forward
    this.lean=dir>0?0.04:-0.06;
  }
  update(dt){ this.lean*=Math.max(0,1-dt*5); }
}

function drawChef(ctx,W,H,chef,belanY){
  const isBoy=chef.isBoy, lean=chef.lean;
  const cx=W/2;

  // Proportions sized to look realistic alongside the dough
  const headR=40;
  const bodyH=96, bodyW=55;
  const bodyY=Math.round(H*0.32);   // chef sits in upper portion of canvas
  const shoulderOff=58;
  const shoulderY=bodyY-Math.round(bodyH*0.28);
  const L1=155, L2=135;   // upper arm, forearm lengths (IK segments)
  const handSpread=72;    // close to shoulderOff so arm vector is mostly vertical (up-down)

  const skin =isBoy?'#f0b98a':'#e8a87c';
  const shirt =isBoy?'#5a9ef5':'#f07aba';
  const hair  ='#241408';
  const pants =isBoy?'#2c3e6b':'#b02060';

  ctx.save();
  ctx.translate(cx,bodyY); ctx.rotate(lean); ctx.translate(-cx,-bodyY);

  // --- crossed legs (lower portion may go off-canvas — that's fine) ---
  ctx.fillStyle=pants;
  ctx.beginPath(); ctx.ellipse(cx-22,bodyY+30,32,13,-0.22,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+22,bodyY+37,32,13, 0.22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.ellipse(cx-46,bodyY+38,16,10,-0.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+46,bodyY+45,16,10, 0.3,0,Math.PI*2); ctx.fill();

  // --- torso ---
  ctx.fillStyle=shirt;
  ctx.beginPath(); ctx.ellipse(cx,bodyY,bodyW,bodyH,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.ellipse(cx,bodyY-bodyH+10,11,14,0,0,Math.PI*2); ctx.fill();

  // --- IK arms (drawn before head so head overlaps arms) ---
  for(const side of [-1,1]){
    const sx=cx+side*shoulderOff, sy=shoulderY;
    const tx=cx+side*handSpread,  ty=belanY;
    const [ex,ey]=computeElbow(sx,sy,tx,ty,L1,L2,side<0);

    ctx.strokeStyle=skin; ctx.lineWidth=16; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.lineWidth=13;
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(tx,ty); ctx.stroke();
    // elbow definition
    ctx.fillStyle=`rgba(0,0,0,0.09)`;
    ctx.beginPath(); ctx.arc(ex,ey,8,0,Math.PI*2); ctx.fill();
    // hand
    ctx.fillStyle=skin;
    ctx.beginPath(); ctx.arc(tx,ty,10,0,Math.PI*2); ctx.fill();
  }

  // --- head ---
  const headY=bodyY-bodyH-headR+6;
  ctx.fillStyle=hair;
  ctx.beginPath(); ctx.arc(cx,headY,headR+3,Math.PI,Math.PI*2); ctx.fill();
  if(!isBoy){
    ctx.beginPath(); ctx.arc(cx,headY-headR-7,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(185,45,105,0.65)';
    ctx.beginPath(); ctx.ellipse(cx-shoulderOff+5,bodyY-bodyH+13,18,12,-0.45,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+shoulderOff-5,bodyY-bodyH+13,18,12, 0.45,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=hair;
    ctx.beginPath(); ctx.arc(cx,headY,headR+3,Math.PI,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(cx,headY,headR,0,Math.PI*2); ctx.fill();

  const eyeY=headY-3;
  ctx.fillStyle='#1a0800';
  ctx.beginPath(); ctx.arc(cx-9,eyeY,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+9,eyeY,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(cx-7,eyeY-2,1.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+11,eyeY-2,1.8,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle=hair; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-14,eyeY-8); ctx.lineTo(cx-5,eyeY-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+14,eyeY-8); ctx.lineTo(cx+5,eyeY-10); ctx.stroke();

  ctx.strokeStyle='#7a3010'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,headY+9,7,0.2,Math.PI-0.2); ctx.stroke();

  ctx.restore();
}

/* ---------- RotiGame ---------- */
class RotiGame{
  constructor(canvas,audio,ir,cfg){
    this.canvas=canvas; this.ctx=canvas.getContext('2d');
    this.audio=audio; this.ir=ir;
    this.chefName=cfg.chefName;
    this.rollsPerRoti=cfg.rollsPerRoti;
    this.rotiType=cfg.rotiType;
    this.totalTime=cfg.totalTime;

    this.rotiCount=0;
    this.currentRolls=0;
    this.timeLeft=cfg.totalTime;
    this.running=true;
    this.lastFrame=performance.now();
    this.flashT=0;
    this.belan={active:false,t:0,dir:1};
    this.flour=new FlourParticles();
    this.chef=new ChefAnim(!!cfg.isBoy);
    this.warnedLow=false;

    this.ir.reset();
    this.ir.onDirectionChange=(toSensor)=>this._onDir(toSensor);
    this.ir.onFullRoll=()=>this._onFullRoll();

    this._loopBound=this._loop.bind(this);
    requestAnimationFrame(this._loopBound);
    audio.playStart();
    this._updateHUD();
  }

  _onDir(toSensor){
    if(!this.running) return;
    this.audio.playRoll();
    const W=this.canvas.clientWidth,H=this.canvas.clientHeight;
    this.flour.puff(W/2,H*DOUGH_CY_R,10);
    const dir=toSensor===1?1:-1;
    this.belan={active:true,t:0,dir};
    this.chef.onDir(dir);
  }

  _onFullRoll(){
    if(!this.running) return;
    this.currentRolls++;
    if(this.currentRolls>=this.rollsPerRoti){
      this.currentRolls=0;
      this.rotiCount++;
      this.flashT=1.0;
      this.audio.playRotiDone();
      const W=this.canvas.clientWidth,H=this.canvas.clientHeight;
      this.flour.puff(W/2,H*DOUGH_CY_R,28);
      this._flyEmoji();
    }
    this._updateHUD();
    this._updateBar();
  }

  _flyEmoji(){
    const el=document.createElement('div');
    el.className='fly-emoji';
    el.textContent=this.rotiType.emoji;
    el.style.left=`${35+Math.random()*30}%`;
    el.style.bottom='38%';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }

  _updateHUD(){
    $('hudTimer').textContent=fmtTime(Math.ceil(this.timeLeft));
    $('hudChef').textContent=this.chefName;
    $('hudRoti').textContent=`${this.rotiCount} ${this.rotiType.emoji}`;
  }
  _updateBar(){
    const pct=this.rollsPerRoti>0?(this.currentRolls/this.rollsPerRoti)*100:0;
    $('rollFill').style.width=`${pct}%`;
  }

  _loop(now){
    if(!this.running) return;
    const dt=Math.min((now-this.lastFrame)/1000,0.1);
    this.lastFrame=now;
    this._update(dt);
    this._draw();
    requestAnimationFrame(this._loopBound);
  }

  _update(dt){
    this.timeLeft=Math.max(0,this.timeLeft-dt);
    if(this.timeLeft===0){ this._end(); return; }
    if(!this.warnedLow&&this.timeLeft<=10){ this.warnedLow=true; this.audio.playWarning(); }
    if(this.flashT>0) this.flashT=Math.max(0,this.flashT-dt*2.8);
    if(this.belan.active){
      this.belan.t+=dt/0.38;
      if(this.belan.t>=1){ this.belan.active=false; }
    }
    this.flour.update(dt);
    this.chef.update(dt);
    this._updateHUD();
  }

  _draw(){
    const cv=this.canvas,ctx=this.ctx;
    const W=cv.clientWidth,H=cv.clientHeight;
    const cx=W/2, doughCY=H*DOUGH_CY_R;
    const belanHW=120;  // equal to chakla radius so belan fits within the board

    // compute live belan Y (same formula as drawBelan uses internally)
    let curBelanY=doughCY;
    if(this.belan.active){
      const t=easeOut(clamp(this.belan.t,0,1));
      curBelanY=this.belan.dir>0
        ? lerp(doughCY-BELAN_SPAN/2, doughCY+BELAN_SPAN/2, t)
        : lerp(doughCY+BELAN_SPAN/2, doughCY-BELAN_SPAN/2, t);
    }

    ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
    drawKitchen(ctx,W,H);
    drawChef(ctx,W,H,this.chef,curBelanY);   // chef behind chakla/dough
    drawChakla(ctx,cx,doughCY,120);          // rolling board

    const progress=this.rollsPerRoti>0?this.currentRolls/this.rollsPerRoti:0;
    drawDough(ctx,cx,doughCY,progress,this.flashT);

    if(this.belan.active){
      drawBelan(ctx,cx,doughCY,this.belan.t,this.belan.dir,BELAN_SPAN,belanHW);
    }

    this.flour.draw(ctx);

    // roll progress arc around dough
    const arcR=lerp(24,105,easeOut(progress))+18;
    const arcPct=this.rollsPerRoti>0?this.currentRolls/this.rollsPerRoti:0;
    if(arcPct>0){
      ctx.beginPath();
      ctx.arc(cx,doughCY,arcR,-Math.PI/2,-Math.PI/2+Math.PI*2*arcPct);
      ctx.strokeStyle=this.timeLeft<=10?'rgba(255,80,40,0.7)':'rgba(255,190,60,0.6)';
      ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
    }

    // roti count badge
    if(this.rotiCount>0){
      const bx=cx+arcR*0.72, by=doughCY+arcR*0.72;
      ctx.beginPath(); ctx.arc(bx,by,22,0,Math.PI*2);
      ctx.fillStyle='rgba(217,96,16,0.9)'; ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 16px Segoe UI';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(this.rotiCount,bx,by);
    }
  }

  _end(){
    this.running=false;
    this.ir.onDirectionChange=null;
    this.ir.onFullRoll=null;
    window.__ui?.showResult(this);
  }

  destroy(){
    this.running=false;
    this.ir.onDirectionChange=null;
    this.ir.onFullRoll=null;
  }
}

/* ---------- UIManager ---------- */
class UIManager{
  constructor(audio,ir){
    this.audio=audio; this.ir=ir; this.game=null;
    this._selType=0; this._selTime=60; this._selChar='girl';
    this._buildChefBtns();
    this._buildTypeBtns();
    this._buildTimerBtns();
    this._bind();
  }

  _buildChefBtns(){
    const row=$('chefBtns');
    [['girl','👧 Girl Chef'],['boy','👦 Boy Chef']].forEach(([char,label])=>{
      const b=document.createElement('button');
      b.className='btn sm'; b.dataset.char=char; b.textContent=label;
      b.addEventListener('click',()=>{
        this.audio.playClick();
        this._selChar=char;
        $('chefBtns').querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel',x.dataset.char===char));
      });
      row.appendChild(b);
    });
    $('chefBtns').querySelector('.btn').classList.add('sel');
  }

  _buildTypeBtns(){
    const row=$('rotiTypeBtns');
    ROTI_TYPES.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='btn sm'; b.dataset.ri=i;
      b.innerHTML=`${t.emoji} ${t.name}<br><small>${t.rolls||'?'} rolls</small>`;
      b.addEventListener('click',()=>{
        this.audio.playClick();
        this._selType=i;
        this._refreshTypeBtns();
        $('customRow').style.display=i===3?'block':'none';
      });
      row.appendChild(b);
    });
    this._refreshTypeBtns();
  }

  _refreshTypeBtns(){
    $('rotiTypeBtns').querySelectorAll('.btn').forEach((b,i)=>b.classList.toggle('sel',i===this._selType));
  }

  _buildTimerBtns(){
    const row=$('timerBtns');
    TIMER_OPTS.forEach(s=>{
      const b=document.createElement('button');
      b.className='btn sm'; b.dataset.s=s;
      b.textContent=s<60?`${s}s`:`${s/60}m`;
      b.addEventListener('click',()=>{ this.audio.playClick(); this._selTime=s; this._refreshTimerBtns(); });
      row.appendChild(b);
    });
    this._refreshTimerBtns();
  }

  _refreshTimerBtns(){
    $('timerBtns').querySelectorAll('.btn').forEach(b=>b.classList.toggle('sel',+b.dataset.s===this._selTime));
  }

  _rollsForType(){
    if(this._selType===3){
      const v=parseInt($('customRolls').value)||5;
      return clamp(v,1,99);
    }
    return ROTI_TYPES[this._selType].rolls;
  }

  _bind(){
    $('bleBtn').addEventListener('click',async()=>{
      this.audio.ensureCtx();
      const ok=await doConnectBLE(s=>$('conStatus').textContent=s);
      if(ok) this._goSetup();
    });
    $('wsBtn').addEventListener('click',async()=>{
      this.audio.ensureCtx();
      const ok=await doConnectWS(s=>$('conStatus').textContent=s);
      if(ok) this._goSetup();
    });
    $('kbBtn').addEventListener('click',()=>{ this.audio.ensureCtx(); this._goSetup(); });
    $('startBtn').addEventListener('click',()=>this._startGame());
    $('resAgainBtn').addEventListener('click',()=>{ this.audio.playClick(); $('scr-result').classList.add('hidden'); this._goSetup(); });
    $('resHomeBtn').addEventListener('click',()=>{ this.audio.playClick(); $('scr-result').classList.add('hidden'); this._goSetup(); });
  }

  _goSetup(){
    $('scr-connect').classList.add('hidden');
    $('scr-result').classList.add('hidden');
    $('scr-setup').classList.remove('hidden');
    this._refreshTypeBtns();
    this._refreshTimerBtns();
  }

  _startGame(){
    this.audio.playClick();
    const name=$('chefName').value.trim()||'Little Chef';
    const rolls=this._rollsForType();
    const cfg={chefName:name,rollsPerRoti:rolls,rotiType:ROTI_TYPES[this._selType],totalTime:this._selTime,isBoy:this._selChar==='boy'};
    $('scr-setup').classList.add('hidden');
    $('hud').classList.remove('hidden');
    $('rollBar').classList.remove('hidden');
    $('sensorHUD').classList.remove('hidden');
    resizeCanvas($('gc'));
    if(this.game) this.game.destroy();
    this.game=new RotiGame($('gc'),this.audio,this.ir,cfg);
  }

  showResult(g){
    $('hud').classList.add('hidden');
    $('rollBar').classList.add('hidden');
    $('sensorHUD').classList.add('hidden');
    $('resCount').textContent=`${g.rotiCount} ${g.rotiType.emoji}`;
    $('resType').textContent=`${g.rotiType.name} · ${g.rollsPerRoti} rolls each`;
    const mins=g.totalTime/60;
    $('resSub').textContent=g.rotiCount>0
      ?`${(g.rotiCount/mins).toFixed(1)} rotis/min — great cooking! 🌟`
      :'Keep rolling, Chef! You\'ll get it! 💪';
    $('scr-result').classList.remove('hidden');
  }
}

/* ---------- BLE / WS connect (mirrors LearnBuddy.html) ---------- */
const dec=v=>new TextDecoder().decode(v);

async function doConnectBLE(status){
  try{
    status('Scanning…');
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{services:['0000ff00-0000-1000-8000-00805f9b34fb']}]
    });
    status('Connecting…');
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');
    const charIR=await svc.getCharacteristic('0000ff09-0000-1000-8000-00805f9b34fb');
    await charIR.startNotifications();
    charIR.addEventListener('characteristicvaluechanged',e=>{
      try{ const d=JSON.parse(dec(e.target.value));
        document.dispatchEvent(new CustomEvent('lb:ir',{detail:{s:d.s,v:d.v}})); }catch(_){}
    });
    status('Connected ✓'); return true;
  }catch(e){ status(`Error: ${e.message}`); return false; }
}

async function doConnectWS(status){
  return new Promise(res=>{
    const host=prompt('ESP32 IP or hostname:','learnbuddy.local');
    if(!host){ res(false); return; }
    status('Connecting…');
    const ws=new WebSocket(`ws://${host}/ws`);
    ws.onopen=()=>{ status('Connected ✓'); res(true); };
    ws.onmessage=e=>{
      try{ const d=JSON.parse(e.data);
        if(d.type==='ir') document.dispatchEvent(new CustomEvent('lb:ir',{detail:{s:d.s,v:d.v}})); }catch(_){}
    };
    ws.onerror=()=>{ status('Connection failed'); res(false); };
  });
}

  resizeCanvas($('gc'));
  window.addEventListener('resize',()=>{ resizeCanvas($('gc')); });
  const audio=new AudioManager();
  const ir=new RotiInput();
  const ui=new UIManager(audio,ir);
  window.__ui=ui;
  if(window.opener) ui._goSetup(); // skip connect if launched from LearnBuddy.html
});
