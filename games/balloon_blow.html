<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Balloon Blow</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a0a2e;color:#fff;
         overflow:hidden;width:100vw;height:100vh;}
    canvas{display:block;width:100%;height:100%;}
    .overlay{
      position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 30%,#2a1060 0%,#0d0020 70%);
    }
    .overlay.hidden{display:none}
    .card{
      background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);
      border-radius:22px;padding:36px 38px;max-width:420px;width:90%;
      text-align:center;backdrop-filter:blur(14px);
    }
    .g-title{font-size:2rem;font-weight:900;
      background:linear-gradient(135deg,#ff80b0,#ffe060,#80e0ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .sub{font-size:.88rem;color:rgba(255,255,255,.5);}
    .txt-input{
      width:100%;padding:10px 14px;font-size:1rem;font-family:inherit;
      background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);
      border-radius:12px;color:#fff;outline:none;text-align:center;margin-bottom:4px;
    }
    .txt-input::placeholder{color:rgba(255,255,255,.35);}
    .opt-label{font-size:.75rem;font-weight:700;color:rgba(255,255,255,.45);
      text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;}
    .opt-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
    .btn{display:inline-block;padding:10px 22px;border:none;border-radius:12px;
      font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;
      transition:opacity .15s,transform .1s;background:#6a30c0;color:#fff;}
    .btn:active{opacity:.8;transform:scale(.97);}
    .btn.blue{background:#2860d8;} .btn.green{background:#208850;}
    .btn.big{font-size:1.15rem;padding:14px 32px;border-radius:16px;
      background:linear-gradient(135deg,#ff3080,#d040c0);
      box-shadow:0 4px 20px rgba(255,80,160,.4);}
    .btn.sm{padding:7px 14px;font-size:.83rem;border-radius:10px;}
    .btn.sel{outline:2px solid #fff;outline-offset:2px;}
    .stat-big{font-size:4rem;font-weight:900;
      background:linear-gradient(135deg,#ffe060,#ff80b0);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    #conStatus{color:rgba(255,255,255,.5);font-size:.83rem;min-height:1.3em;margin-top:8px;}
  </style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- CONNECT -->
<div id="scr-connect" class="overlay">
  <div class="card">
    <div class="g-title">🎈 Balloon Blow</div>
    <p class="sub" style="margin:8px 0 22px">Connect your LearnBuddy board</p>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:220px;margin:0 auto">
      <button id="bleBtn"  class="btn">Bluetooth 📶</button>
      <button id="wsBtn"   class="btn blue">Wi-Fi 🌐</button>
      <button id="kbBtn"   class="btn green">Keyboard ⌨️</button>
    </div>
    <p id="conStatus"></p>
  </div>
</div>

<!-- SETUP -->
<div id="scr-setup" class="overlay hidden">
  <div class="card">
    <div class="g-title">🎈 Balloon Blow</div>
    <p class="sub" style="margin:8px 0 18px">Who's blowing today? 🎉</p>
    <input class="txt-input" id="playerName" type="text" maxlength="14"
           placeholder="Little Blower" autocomplete="off">
    <div class="opt-label">Choose Character</div>
    <div class="opt-row" id="charBtns"></div>
    <div class="opt-label">Difficulty</div>
    <div class="opt-row" id="diffBtns"></div>
    <p class="sub" style="margin-top:14px;font-size:.78rem">
      Wave <strong>S1 → S2 → S1 → S2</strong> to pump the balloon!
    </p>
    <button id="startBtn" class="btn big" style="margin-top:18px">Blow It! 🎈</button>
  </div>
</div>

<!-- RESULT -->
<div id="scr-result" class="overlay hidden">
  <div class="card">
    <div class="g-title" id="resTitle">Time's Up! 🎉</div>
    <div class="stat-big" id="resScore">0 🎈</div>
    <p style="font-size:1rem;color:rgba(255,255,255,.6);margin-bottom:2px" id="resStar"></p>
    <p style="font-size:.85rem;color:rgba(255,255,255,.45)" id="resSub"></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px">
      <button id="resAgainBtn" class="btn green">Play Again 🔁</button>
      <button id="resHomeBtn"  class="btn blue">Home 🏠</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $   = id => document.getElementById(id);
const lerp= (a,b,t) => a+(b-a)*t;
const clamp=(v,lo,hi) => v<lo?lo:v>hi?hi:v;
const rand= (lo,hi) => lo+Math.random()*(hi-lo);
const TAU = Math.PI*2;

const GAME_TIME  = 60;
const DIFF = {
  easy:   { pumps:5,  label:'Easy 😊' },
  medium: { pumps:8,  label:'Medium 😄' },
  hard:   { pumps:12, label:'Hard 😤' },
};
const COLORS = ['#ff4466','#ff9900','#44cc55','#44aaff','#cc44ff','#ff66cc','#ffe033','#00ddcc'];
const MIN_R=10, MAX_R=52;

/* ── IR ──────────────────────────────────────────────────────────────────── */
class BalloonIR {
  constructor(onPump){
    this._last=0; this._blocked=[false,false]; this._cb=onPump;
    window.addEventListener('message', e=>{ if(e.data?.type==='ir') this._ir(e.data.s,e.data.v); });
    document.addEventListener('lb:ir', e=>{ const d=e.detail; this._ir(d.s??d.sensor,d.v??d.value); });
    window.addEventListener('keydown', e=>this._key(e));
  }
  _ir(s,v){
    const i=s-1, blocked=(v===0);
    if(!blocked && this._blocked[i] && s!==this._last){ this._last=s; this._cb(); }
    this._blocked[i]=blocked;
  }
  _key(e){
    const k=e.key.toLowerCase();
    if((k==='arrowleft'||k==='a') && 1!==this._last){ this._last=1; this._cb(); }
    if((k==='arrowright'||k==='d') && 2!==this._last){ this._last=2; this._cb(); }
  }
}

/* ── floating balloon (already released, drifting in sky) ───────────────── */
class FloatingBalloon {
  constructor(x,y,color,r){
    this.x=x; this.y=y; this.color=color; this.r=r;
    this.vy=-rand(70,110);
    this.vx=rand(-25,25);
    this.swayAmp=rand(10,22);
    this.swayFreq=rand(0.7,1.4);
    this.swayT=rand(0,TAU);
    this.bobAmp=rand(4,10);
    this.bobFreq=rand(0.4,0.9);
    this.bobT=rand(0,TAU);
    this.launching=true;
    this.targetY=rand(50,200);
    this.opacity=0;
    this.stringLen=rand(32,55);
    this.rot=rand(-0.12,0.12);
    this.baseX=x;
  }
  update(dt){
    this.opacity=Math.min(1,this.opacity+dt*4);
    if(this.launching){
      this.y+=this.vy*dt;
      this.vx*=Math.pow(0.02,dt);
      this.x+=this.vx*dt;
      if(this.y<=this.targetY){ this.y=this.targetY; this.vy=0; this.launching=false; this.baseX=this.x; }
    } else {
      this.swayT+=dt*this.swayFreq;
      this.bobT +=dt*this.bobFreq;
      this.x=this.baseX+Math.sin(this.swayT)*this.swayAmp;
      this.y=this.targetY+Math.sin(this.bobT)*this.bobAmp;
    }
    const W=window.innerWidth;
    if(this.baseX<this.r+10)   this.baseX+=30*dt;
    if(this.baseX>W-this.r-10) this.baseX-=30*dt;
  }
  draw(ctx){
    ctx.save();
    ctx.globalAlpha=this.opacity;
    ctx.translate(this.x,this.y);
    ctx.rotate(this.rot+Math.sin(this.swayT)*0.06);
    _drawBalloonShape(ctx,0,0,this.r,this.color);
    // dangling string
    ctx.strokeStyle='rgba(60,60,60,0.55)'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(0,this.r*1.12+5);
    const cx2=rand(-10,10);
    ctx.quadraticCurveTo(cx2,this.r*1.12+this.stringLen*0.5,cx2*0.3,this.r*1.12+this.stringLen);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=1;
  }
}

/* ── particles ───────────────────────────────────────────────────────────── */
class Particle {
  constructor(x,y,color){
    const a=rand(0,TAU), spd=rand(90,260);
    this.x=x; this.y=y; this.vx=Math.cos(a)*spd; this.vy=Math.sin(a)*spd;
    this.r=rand(4,10); this.color=color; this.life=1;
  }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.vy+=180*dt; this.life-=dt*1.6; }
  draw(ctx){
    ctx.globalAlpha=Math.max(0,this.life);
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ── air puff ────────────────────────────────────────────────────────────── */
class AirPuff {
  constructor(x,y){ this.ox=x; this.oy=y; this.t=0; }
  update(dt){ this.t+=dt*3; }
  done(){ return this.t>=1; }
  draw(ctx,bx,by){
    const t=this.t, px=lerp(this.ox,bx,t), py=lerp(this.oy,by,t);
    ctx.globalAlpha=(1-t)*0.45;
    ctx.strokeStyle='#bbddff'; ctx.lineWidth=1.5;
    for(let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.arc(px+i*5,py,6+t*9,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

/* ── straw ───────────────────────────────────────────────────────────────── */
function _drawStraw(ctx,x1,y1,x2,y2){
  ctx.save();
  const dx=x2-x1, dy=y2-y1;
  const angle=Math.atan2(dy,dx);
  const len=Math.sqrt(dx*dx+dy*dy);
  ctx.translate(x1,y1);
  ctx.rotate(angle);
  const w=5;
  // outer tube — warm yellow (like a real straw)
  const g=ctx.createLinearGradient(0,-w,0,w);
  g.addColorStop(0,'#f5e060');
  g.addColorStop(0.3,'#ffe820');
  g.addColorStop(0.7,'#d4a800');
  g.addColorStop(1,'#a87a00');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(0,-w/2,len,w,w/2); ctx.fill();
  // inner hollow highlight
  ctx.fillStyle='rgba(255,255,200,0.45)';
  ctx.beginPath(); ctx.roundRect(2,-(w/2-1.5),len-4,w/2-1,1); ctx.fill();
  ctx.restore();
}

/* ── balloon shape ───────────────────────────────────────────────────────── */
function _drawBalloonShape(ctx,cx,cy,r,color){
  const g=ctx.createRadialGradient(cx-r*.28,cy-r*.32,r*.04,cx,cy,r*1.1);
  g.addColorStop(0,'rgba(255,255,255,0.88)');
  g.addColorStop(0.18,color);
  g.addColorStop(1,_shade(color,-45));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(cx,cy,r*.88,r*1.05,0,0,TAU); ctx.fill();
  ctx.fillStyle=_shade(color,-30);
  ctx.beginPath(); ctx.arc(cx,cy+r*1.06,Math.max(3,r*0.1),0,TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx-Math.max(2,r*.08),cy+r*1.06+2);
  ctx.lineTo(cx,cy+r*1.06+Math.max(6,r*.22));
  ctx.lineTo(cx+Math.max(2,r*.08),cy+r*1.06+2);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.34)';
  ctx.beginPath(); ctx.ellipse(cx-r*.26,cy-r*.32,r*.18,r*.10,-0.5,0,TAU); ctx.fill();
}
function _shade(col,amt){
  const r=clamp(parseInt(col.slice(1,3),16)+amt,0,255);
  const g=clamp(parseInt(col.slice(3,5),16)+amt,0,255);
  const b=clamp(parseInt(col.slice(5,7),16)+amt,0,255);
  return `rgb(${r},${g},${b})`;
}

/* ── game ────────────────────────────────────────────────────────────────── */
class BalloonGame {
  constructor(canvas,ctx,audio,cfg){
    this.cv=canvas; this.ctx=ctx; this.audio=audio;
    this.name=cfg.name; this.isBoy=cfg.isBoy; this.pumpsNeeded=cfg.pumpsNeeded;
    this.score=0; this.timeLeft=GAME_TIME; this.running=true;
    this.t=0; this.lastNow=performance.now();
    this.floaters=[]; this.particles=[]; this.puffs=[];
    this.colorIdx=0; this.pumps=0; this.cheekT=0;
    this.releasing=false; this.releaseT=0;
    this._loop=this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }
  _color(){ return COLORS[this.colorIdx%COLORS.length]; }

  onPump(){
    if(!this.running||this.releasing) return;
    this.pumps++; this.cheekT=1; this.audio.playPump();
    const {mx,my}=this._mouthXY();
    this.puffs.push(new AirPuff(mx,my));
    if(this.pumps>=this.pumpsNeeded) this._release();
  }
  _mouthXY(){
    const dpr=window.devicePixelRatio||1;
    const W=this.cv.width/dpr, H=this.cv.height/dpr;
    const cx=W*0.30, groundY=H*0.78;
    const bodyY=groundY-28, headCY=bodyY-96;
    // right corner of mouth — matches _drawCharacter mouth arc at (cx, headCY+8) r=7
    return { mx:cx+7, my:headCY+9 };
  }
  _balloonXY(){
    const {mx,my}=this._mouthXY();
    const prog=Math.max(this.pumps/this.pumpsNeeded,0);
    const r=lerp(MIN_R,MAX_R,prog);
    return { bx:mx+r+4, by:my-r*0.3, r };
  }
  _release(){
    this.releasing=true; this.releaseT=0;
    const {bx,by}=this._balloonXY();
    const col=this._color();
    for(let i=0;i<16;i++) this.particles.push(new Particle(bx,by,col));
    for(let i=0;i<6;i++)  this.particles.push(new Particle(bx,by,'#fff'));
    this.audio.playRelease();
    this.floaters.push(new FloatingBalloon(bx,by,col,MAX_R));
    this.score++;
    setTimeout(()=>{
      if(!this.running) return;
      this.releasing=false; this.pumps=0; this.colorIdx++; this.cheekT=0;
    },500);
  }
  _loop(now){
    if(!this.running) return;
    const dt=Math.min((now-this.lastNow)/1000,.1);
    this.lastNow=now; this.t+=dt;
    this._update(dt); this._draw();
    requestAnimationFrame(this._loop);
  }
  _update(dt){
    this.timeLeft-=dt;
    if(this.timeLeft<=0){ this.timeLeft=0; this.running=false; window.__ui?.showResult(this); return; }
    if(this.releasing) this.releaseT=Math.min(this.releaseT+dt*4,1);
    this.cheekT=Math.max(0,this.cheekT-dt*2.5);
    this.floaters.forEach(f=>f.update(dt));
    this.particles=this.particles.filter(p=>{ p.update(dt); return p.life>0; });
    this.puffs=this.puffs.filter(p=>{ p.update(dt); return !p.done(); });
  }
  _draw(){
    const cv=this.cv, ctx=this.ctx, dpr=window.devicePixelRatio||1;
    const W=cv.width/dpr, H=cv.height/dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    _drawBg(ctx,W,H,this.t);
    this.floaters.forEach(f=>f.draw(ctx));
    const groundY=H*0.78, cx=W*0.30;
    _drawCharacter(ctx,cx,groundY,this.isBoy,this.cheekT,this.releasing&&this.releaseT>0.7);
    if(!this.releasing){
      const {bx,by,r}=this._balloonXY();
      const {mx,my}=this._mouthXY();
      this.puffs.forEach(p=>p.draw(ctx,bx,by));
      // straw from mouth to balloon knot
      _drawStraw(ctx,mx,my,bx,by+r*1.06+4);
      if(this.pumps>0) _drawBalloonShape(ctx,bx,by,r,this._color());
    }
    this.particles.forEach(p=>p.draw(ctx));
    _drawHUD(ctx,W,H,this.score,this.timeLeft,this.pumps,this.pumpsNeeded,this.releasing,this.name);
  }
  destroy(){ this.running=false; }
}

/* ── background ──────────────────────────────────────────────────────────── */
function _drawBg(ctx,W,H,t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#9ecfea'); sky.addColorStop(1,'#e4f4ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#7ac878'; ctx.fillRect(0,H*0.78,W,H*0.22);
  ctx.fillStyle='#58ab58'; ctx.fillRect(0,H*0.78,W,4);
  _cloud(ctx,((W*0.12+t*16)%(W+140))-70, H*0.10,65,.82);
  _cloud(ctx,((W*0.50+t*10)%(W+140))-70, H*0.07,78,.78);
  _cloud(ctx,((W*0.78+t*13)%(W+140))-70, H*0.14,50,.85);
}
function _cloud(ctx,x,y,r,a){
  ctx.globalAlpha=a; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y+r*.2,r*.7,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x-r*.65,y+r*.15,r*.65,0,TAU); ctx.fill();
  ctx.globalAlpha=1;
}

/* ── character ───────────────────────────────────────────────────────────── */
function _drawCharacter(ctx,cx,groundY,isBoy,cheekT,happy){
  ctx.save();
  const skin=isBoy?'#f0b98a':'#e8a87c';
  const hair=isBoy?'#3a2208':'#4a1a00';
  const shirt=isBoy?'#3a80d0':'#d03060';
  const bodyY=groundY-28;
  const headCY=bodyY-96;

  // body
  ctx.fillStyle=shirt;
  ctx.beginPath(); ctx.roundRect(cx-26,bodyY-68,52,70,10); ctx.fill();

  // legs
  ctx.fillStyle='#2255aa';
  ctx.beginPath(); ctx.ellipse(cx-22,bodyY+8,27,13,0.15,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+20,bodyY+6,27,13,-0.15,0,TAU); ctx.fill();

  // right arm — raised, hand near mouth area holding balloon stem
  ctx.strokeStyle=skin; ctx.lineWidth=11; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx+26,bodyY-48); ctx.lineTo(cx+52,headCY+10); ctx.stroke();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(cx+54,headCY+8,9,0,TAU); ctx.fill();

  // left arm — relaxed
  ctx.strokeStyle=skin; ctx.lineWidth=11;
  ctx.beginPath(); ctx.moveTo(cx-26,bodyY-48); ctx.lineTo(cx-44,bodyY-20); ctx.stroke();
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(cx-45,bodyY-18,9,0,TAU); ctx.fill();

  // neck
  ctx.fillStyle=skin; ctx.fillRect(cx-9,bodyY-80,18,16);

  // head
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.ellipse(cx,headCY,25,27,0,0,TAU); ctx.fill();

  // puffed cheeks
  if(cheekT>0){
    const cp=cheekT;
    ctx.fillStyle=`rgba(255,175,115,${cp*.75})`;
    ctx.beginPath(); ctx.ellipse(cx-18,headCY+5,13*cp+3,10*cp+2,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+18,headCY+5,13*cp+3,10*cp+2,0,0,TAU); ctx.fill();
  }

  // hair
  ctx.fillStyle=hair;
  if(isBoy){
    ctx.beginPath(); ctx.ellipse(cx,headCY-14,26,15,0,Math.PI,TAU); ctx.fill();
    ctx.fillRect(cx-26,headCY-14,52,7);
  } else {
    ctx.beginPath(); ctx.ellipse(cx,headCY-15,27,16,0,Math.PI,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx-24,headCY+8,5,23,0.1,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+24,headCY+8,5,23,-0.1,0,TAU); ctx.fill();
  }

  // eyes
  if(happy){
    ctx.strokeStyle='#222'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx-10,headCY-2,5,Math.PI+0.3,TAU-0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+10,headCY-2,5,Math.PI+0.3,TAU-0.3); ctx.stroke();
  } else {
    ctx.fillStyle='#222';
    ctx.beginPath(); ctx.arc(cx-10,headCY-2,4,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10,headCY-2,4,0,TAU); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cx-9,headCY-3,1.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+11,headCY-3,1.5,0,TAU); ctx.fill();
  }

  // mouth
  if(cheekT>0.3){
    ctx.fillStyle='#aa4422';
    ctx.beginPath(); ctx.ellipse(cx,headCY+10,5+cheekT*3,5+cheekT*2,0,0,TAU); ctx.fill();
  } else {
    ctx.strokeStyle='#aa4422'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,headCY+8,7,0.2,Math.PI-0.2); ctx.stroke();
  }

  ctx.restore();
}

/* ── HUD ─────────────────────────────────────────────────────────────────── */
function _drawHUD(ctx,W,H,score,timeLeft,pumps,pumpsNeeded,releasing,name){
  // timer bar
  const bw=Math.min(W-40,300), bx=(W-bw)/2;
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.roundRect(bx,12,bw,20,10); ctx.fill();
  const frac=timeLeft/GAME_TIME;
  ctx.fillStyle=frac>0.4?'#44cc44':frac>0.2?'#ffaa00':'#ff3333';
  ctx.beginPath(); ctx.roundRect(bx,12,bw*frac,20,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 12px system-ui'; ctx.textAlign='center';
  ctx.fillText(`⏱ ${Math.ceil(timeLeft)}s`, W/2, 27);

  // score top-right
  ctx.textAlign='right';
  ctx.font='bold 26px system-ui';
  ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillText(`🎈 ${score}`, W-17, 52);
  ctx.fillStyle='#fff';             ctx.fillText(`🎈 ${score}`, W-18, 50);
  ctx.font='11px system-ui'; ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('balloons', W-18, 65);

  // name top-left
  ctx.textAlign='left'; ctx.font='bold 13px system-ui'; ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillText(name,17,51);
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillText(name,16,50);

  // pump progress dots bottom-center
  if(!releasing && pumpsNeeded>0){
    const ds=10, gap=5, totalW=pumpsNeeded*(ds*2)+((pumpsNeeded-1)*gap);
    const sx=(W-totalW)/2, sy=H-26;
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.roundRect(sx-10,sy-ds-4,totalW+20,ds*2+8,8); ctx.fill();
    for(let i=0;i<pumpsNeeded;i++){
      const dx=sx+i*(ds*2+gap)+ds;
      ctx.fillStyle=i<pumps?'#ffe030':'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.arc(dx,sy,ds,0,TAU); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
    ctx.fillText(`${pumps}/${pumpsNeeded} pumps`, W/2, H-10);
  }
}

/* ── audio ───────────────────────────────────────────────────────────────── */
class AudioManager{
  constructor(){ this._ctx=null; }
  ensureCtx(){
    try{
      if(!this._ctx) this._ctx=new(window.AudioContext||window.webkitAudioContext)();
      if(this._ctx.state==='suspended') this._ctx.resume();
    }catch(_){}
  }
  _tone(freq,dur,type='sine',vol=0.22){
    if(!this._ctx) return;
    try{
      const c=this._ctx,g=c.createGain(),o=c.createOscillator();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(vol,c.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+dur+0.05);
    }catch(_){}
  }
  playClick()   { this._tone(700,.07); }
  playPump()    { this._tone(260+Math.random()*50,.13,'sine',.16); setTimeout(()=>this._tone(300,.07,'sine',.08),80); }
  playRelease() { [880,1100,1320].forEach((f,i)=>setTimeout(()=>this._tone(f,.12,'sine',.2),i*55)); }
  playStart()   { [440,550,660].forEach((f,i)=>setTimeout(()=>this._tone(f,.12),i*110)); }
  playEnd()     { [660,550,440,330].forEach((f,i)=>setTimeout(()=>this._tone(f,.15),i*120)); }
}

/* ── UI manager ──────────────────────────────────────────────────────────── */
class UIManager{
  constructor(canvas,ctx,audio){
    this.canvas=canvas; this.ctx=ctx; this.audio=audio; this.game=null;
    this._selChar='girl'; this._selDiff='medium';
    this._ir=new BalloonIR(()=>this.game?.onPump());
    this._buildCharBtns(); this._buildDiffBtns(); this._bind();
    this._resize(); window.addEventListener('resize',()=>this._resize());
  }
  _resize(){
    const dpr=window.devicePixelRatio||1;
    this.canvas.width =window.innerWidth*dpr;
    this.canvas.height=window.innerHeight*dpr;
  }
  _buildCharBtns(){
    const row=$('charBtns');
    [['girl','👧 Girl'],['boy','👦 Boy']].forEach(([id,label])=>{
      const b=document.createElement('button');
      b.className='btn sm'; b.dataset.char=id; b.textContent=label;
      b.addEventListener('click',()=>{
        this.audio.playClick(); this._selChar=id;
        row.querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel',x.dataset.char===id));
      });
      row.appendChild(b);
    });
    row.querySelector('[data-char="girl"]').classList.add('sel');
  }
  _buildDiffBtns(){
    const row=$('diffBtns');
    Object.entries(DIFF).forEach(([id,cfg])=>{
      const b=document.createElement('button');
      b.className='btn sm'; b.dataset.diff=id; b.textContent=cfg.label;
      b.addEventListener('click',()=>{
        this.audio.playClick(); this._selDiff=id;
        row.querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel',x.dataset.diff===id));
      });
      row.appendChild(b);
    });
    row.querySelector('[data-diff="medium"]').classList.add('sel');
  }
  _bind(){
    $('bleBtn').addEventListener('click',async()=>{ this.audio.ensureCtx(); if(await _connectBLE(s=>$('conStatus').textContent=s)) this._goSetup(); });
    $('wsBtn') .addEventListener('click',async()=>{ this.audio.ensureCtx(); if(await _connectWS (s=>$('conStatus').textContent=s)) this._goSetup(); });
    $('kbBtn') .addEventListener('click',()=>{ this.audio.ensureCtx(); this._goSetup(); });
    $('startBtn')   .addEventListener('click',()=>this._start());
    $('resAgainBtn').addEventListener('click',()=>{ this.audio.playClick(); $('scr-result').classList.add('hidden'); this._goSetup(); });
    $('resHomeBtn') .addEventListener('click',()=>{ this.audio.playClick(); $('scr-result').classList.add('hidden'); this._goSetup(); });
  }
  _goSetup(){
    ['scr-connect','scr-result'].forEach(id=>$(id).classList.add('hidden'));
    $('scr-setup').classList.remove('hidden');
  }
  _start(){
    this.audio.playClick();
    const name=$('playerName').value.trim()||'Little Blower';
    $('scr-setup').classList.add('hidden');
    if(this.game) this.game.destroy();
    this.game=new BalloonGame(this.canvas,this.ctx,this.audio,{
      name, isBoy:this._selChar==='boy',
      pumpsNeeded:DIFF[this._selDiff].pumps
    });
    this.audio.playStart();
  }
  showResult(g){
    const s=g.score;
    $('resScore').textContent=`${s} 🎈`;
    $('resTitle').textContent=s>=10?'Balloon Champion! 🏆':s>=5?'Great Blowing! 🎉':'Keep Practicing! 💪';
    $('resStar').textContent=s>=10?'⭐⭐⭐':s>=5?'⭐⭐':'⭐';
    $('resSub').textContent=s>=10?'Amazing lung power!':s>=5?'Fantastic effort!':'Practice makes perfect!';
    $('scr-result').classList.remove('hidden');
    this.audio.playEnd();
  }
}

/* ── BLE / WS ────────────────────────────────────────────────────────────── */
const _dec=v=>new TextDecoder().decode(v);
function _dispatchIR(s,v){ document.dispatchEvent(new CustomEvent('lb:ir',{detail:{s,v}})); }
async function _connectBLE(onStatus){
  try{
    onStatus('Scanning…');
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'LearnBuddy'}],
      optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb']
    });
    onStatus('Connecting…');
    const srv=await(await dev.gatt.connect()).getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');
    const ch=await srv.getCharacteristic('0000ff09-0000-1000-8000-00805f9b34fb');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{
      try{ const d=JSON.parse(_dec(e.target.value)); _dispatchIR(d.s,d.v); }catch(_){}
    });
    onStatus('Connected ✓'); return true;
  }catch(e){ onStatus(e.name==='NotFoundError'?'No device found':String(e)); return false; }
}
async function _connectWS(onStatus){
  return new Promise(res=>{
    const host=location.hostname||'learnbuddy.local';
    onStatus(`Connecting ws://${host}:81…`);
    try{
      const ws=new WebSocket(`ws://${host}:81`);
      ws.onopen =()=>{ onStatus('Connected ✓'); res(true); };
      ws.onerror=()=>{ onStatus('Cannot connect'); res(false); };
      ws.onmessage=e=>{ try{ const d=JSON.parse(e.data); if(d.type==='ir') _dispatchIR(d.sensor,d.value); }catch(_){} };
    }catch(e){ onStatus(String(e)); res(false); }
  });
}
window.addEventListener('message',e=>{ if(e.data?.type==='ir') _dispatchIR(e.data.s,e.data.v); });

/* ── boot ────────────────────────────────────────────────────────────────── */
const canvas=$('cv'), ctx=canvas.getContext('2d');
const audio=new AudioManager();
const ui=new UIManager(canvas,ctx,audio);
window.__ui=ui;
if(window.opener) ui._goSetup();
</script>
