<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roti Maker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:#1a0800;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{display:block;width:100vw;height:100vh;}

/* ── overlays ── */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;}
.overlay.dim{background:rgba(0,0,0,.55);}
.hidden{display:none!important;}

/* ── card ── */
.card{
  background:linear-gradient(155deg,#fff9f2 0%,#fff0d8 60%,#ffe8c4 100%);
  border-radius:28px;padding:0;max-width:500px;width:93%;
  box-shadow:0 28px 72px rgba(0,0,0,.55),0 0 0 1.5px rgba(255,160,60,.25);
  overflow:hidden;max-height:94vh;display:flex;flex-direction:column;
}
.card-head{
  background:linear-gradient(135deg,#e05010 0%,#c03808 50%,#8c2400 100%);
  padding:22px 28px 18px;text-align:center;flex-shrink:0;
  position:relative;overflow:hidden;
}
.card-head::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 30%,rgba(255,180,60,.28),transparent 65%);
}
.card-head h1{font-size:1.7rem;font-weight:900;color:#fff;letter-spacing:.4px;position:relative;}
.card-head .sub{font-size:.82rem;color:rgba(255,230,190,.75);margin-top:3px;position:relative;}
.card-body{padding:22px 26px 24px;overflow-y:auto;}

/* ── inputs ── */
.txt-input{
  font-size:1rem;padding:10px 16px;border:2px solid #e8b880;
  border-radius:14px;background:#fffaf4;font-family:inherit;
  width:100%;text-align:center;transition:border-color .15s;
}
.txt-input:focus{outline:none;border-color:#e06010;}

/* ── option rows ── */
.opt-label{
  font-size:.68rem;font-weight:800;color:#9a4000;
  text-transform:uppercase;letter-spacing:.1em;margin:16px 0 7px;
}
.opt-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}

/* ── buttons ── */
.btn{
  font-family:inherit;font-weight:800;border:none;border-radius:14px;
  cursor:pointer;padding:10px 18px;font-size:.88rem;color:#fff;
  background:linear-gradient(180deg,#f08040,#c85010);
  box-shadow:0 4px 0 #8c3000,0 6px 16px rgba(0,0,0,.18);
  transition:transform .08s,box-shadow .08s;line-height:1.3;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8c3000;}
.btn.green{background:linear-gradient(180deg,#80d860,#38a820);box-shadow:0 4px 0 #1a6808;}
.btn.green:active{box-shadow:0 1px 0 #1a6808;}
.btn.blue{background:linear-gradient(180deg,#60b8f0,#2880d0);box-shadow:0 4px 0 #1050a0;}
.btn.blue:active{box-shadow:0 1px 0 #1050a0;}
.btn.big{font-size:1.1rem;padding:14px 36px;border-radius:18px;}
.btn.sm{font-size:.78rem;padding:8px 13px;border-radius:11px;}
.btn.sel{
  background:linear-gradient(180deg,#ff6820,#b02800);
  box-shadow:0 4px 0 #6c1400,0 0 0 2.5px #ff9040;
}

/* ── HUD ── */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:stretch;gap:0;
  background:linear-gradient(180deg,rgba(20,6,0,.95),rgba(20,6,0,.7));
  backdrop-filter:blur(8px);
  border-bottom:1.5px solid rgba(255,140,40,.25);
}
.hud-cell{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 12px;
}
.hud-cell+.hud-cell{border-left:1px solid rgba(255,140,40,.18);}
.hud-lbl{font-size:.58rem;font-weight:700;color:rgba(255,160,60,.55);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.hud-val{font-size:1.3rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
#hudTimer.warn{color:#ff5040;animation:blink .6s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ── sensor dots ── */
#sensorHUD{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;z-index:10;
}
.sdot{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.07);
  border:2.5px solid rgba(255,160,60,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:800;color:rgba(255,160,60,.45);
  transition:all .1s;
}
.sdot.active{
  background:radial-gradient(circle,#ffd54a,#ff8000);
  border-color:#ffd54a;color:#3d1000;
  box-shadow:0 0 18px rgba(255,180,0,.7);
  transform:scale(1.15);
}

/* ── roll progress bar ── */
#rollBar{
  position:fixed;bottom:0;left:0;right:0;height:7px;
  background:rgba(0,0,0,.45);z-index:10;
}
#rollFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ffb040,#ff5010,#ff2010);
  border-radius:0 4px 4px 0;
  transition:width .1s ease-out;
}

/* ── fly-roti animation ── */
.fly-roti{
  position:fixed;font-size:2.8rem;pointer-events:none;z-index:15;
  animation:flyRoti 1.2s cubic-bezier(.2,.8,.4,1) forwards;
}
@keyframes flyRoti{
  0%  {opacity:1;transform:scale(1) translateY(0);}
  50% {opacity:1;transform:scale(1.6) translateY(-130px);}
  100%{opacity:0;transform:scale(1.1) translateY(-200px);}
}

/* ── result ── */
.stat-big{font-size:3rem;font-weight:900;color:#c85010;margin:10px 0 4px;}
</style>
</head>
<body>

<canvas id="gc"></canvas>

<!-- HUD (hidden until game starts) -->
<div id="hud" class="hidden">
  <div class="hud-cell">
    <div class="hud-lbl">Time</div>
    <div class="hud-val" id="hudTimer">1:00</div>
  </div>
  <div class="hud-cell">
    <div class="hud-lbl">Chef</div>
    <div class="hud-val" id="hudChef" style="font-size:.95rem">—</div>
  </div>
  <div class="hud-cell">
    <div class="hud-lbl">Rotis</div>
    <div class="hud-val" id="hudRoti">0</div>
  </div>
</div>
<div id="rollBar" class="hidden"><div id="rollFill"></div></div>
<div id="sensorHUD" class="hidden">
  <div class="sdot" id="s1dot">◀ S1</div>
  <div class="sdot" id="s2dot">S2 ▶</div>
</div>

<!-- CONNECT -->
<div id="scr-connect" class="overlay">
  <div class="card">
    <div class="card-head">
      <h1>🫓 Roti Maker</h1>
      <p class="sub">Roll the belan · make rotis · beat the clock!</p>
    </div>
    <div class="card-body" style="text-align:center">
      <p style="color:#888;font-size:.85rem;margin-bottom:18px">Connect your LearnBuddy board</p>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:220px;margin:0 auto">
        <button id="bleBtn" class="btn">📶 Bluetooth</button>
        <button id="wsBtn"  class="btn blue">🌐 Wi-Fi</button>
        <button id="kbBtn"  class="btn green">⌨️ Keyboard</button>
      </div>
      <p id="conStatus" style="color:#aaa;font-size:.82rem;margin-top:14px;min-height:1.4em"></p>
    </div>
  </div>
</div>

<!-- SETUP -->
<div id="scr-setup" class="overlay hidden">
  <div class="card">
    <div class="card-head">
      <div style="font-size:2.6rem;margin-bottom:6px">🫓</div>
      <h1>Roti Maker</h1>
      <p class="sub">What's your name, Chef?</p>
    </div>
    <div class="card-body">
      <input class="txt-input" id="chefName" type="text" maxlength="14"
             placeholder="Little Chef" autocomplete="off">

      <div class="opt-label">Choose Chef</div>
      <div class="opt-row" id="chefBtns"></div>

      <div class="opt-label">Roti Type</div>
      <div class="opt-row" id="rotiTypeBtns"></div>
      <div id="customRow" style="margin-top:9px;display:none;text-align:center">
        <input type="number" id="customRolls" min="1" max="99" value="5"
          style="font-size:1.05rem;padding:7px 12px;border:2px solid #e0b080;border-radius:10px;
                 width:80px;text-align:center;font-family:inherit;background:#fffaf4;">
        <span style="color:#888;font-size:.82rem"> rolls per roti</span>
      </div>

      <div class="opt-label">Time Limit</div>
      <div class="opt-row" id="timerBtns"></div>

      <button id="startBtn" class="btn big" style="margin-top:22px;width:100%">Let's Cook! 🍳</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="scr-result" class="overlay dim hidden">
  <div class="card">
    <div class="card-head">
      <div style="font-size:2.4rem;margin-bottom:4px" id="resEmoji">🫓</div>
      <h1 id="resTitle">Time's Up!</h1>
      <p class="sub" id="resStars">⭐⭐⭐</p>
    </div>
    <div class="card-body" style="text-align:center">
      <div class="stat-big" id="resCount">0 🫓</div>
      <div style="font-size:.95rem;color:#888;margin-top:2px" id="resType"></div>
      <div style="font-size:.82rem;color:#aaa;margin-top:6px" id="resSub"></div>
      <div id="rotiIcons" style="font-size:1.8rem;letter-spacing:2px;margin:14px 0 4px;min-height:2.2rem"></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:20px">
        <button id="resAgainBtn" class="btn green">Cook Again 🔁</button>
        <button id="resHomeBtn"  class="btn blue">Home 🏠</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const ROTI_TYPES=[
  {name:'Plain Roti',  emoji:'🫓', rolls:5 },
  {name:'Tandoori',    emoji:'🔥', rolls:10},
  {name:'Paratha',     emoji:'🥙', rolls:15},
  {name:'Custom',      emoji:'⚙️', rolls:0 },
];
const TIMER_OPTS=[30,60,120,180,240,300,360,420,480,540,600];
const DOUGH_CY_R=0.62;
const BELAN_SPAN=72;
const $=id=>document.getElementById(id);
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return`${m}:${String(ss).padStart(2,'0')}`;}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-(1-t)*(1-t);}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}

/* ── Audio ──────────────────────────────────────────────────────────── */
class AudioManager{
  constructor(){this._ctx=null;this._en=true;}
  _ac(){
    if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(this._ctx.state==='suspended')this._ctx.resume();
    return this._ctx;
  }
  ensureCtx(){try{this._ac();}catch(_){}}
  _tone(freq,dur,type='sine',vol=0.3,atk=0.01){
    if(!this._en)return;
    try{
      const c=this._ac(),g=c.createGain(),o=c.createOscillator();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(vol,c.currentTime+atk);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+atk+dur);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+atk+dur+0.05);
    }catch(_){}
  }
  _noise(dur,vol=0.18,lo=300,hi=1200){
    if(!this._en)return;
    try{
      const c=this._ac(),buf=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
      const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
      f.type='bandpass';f.frequency.value=(lo+hi)/2;f.Q.value=0.6;
      g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      src.buffer=buf;src.connect(f);f.connect(g);g.connect(c.destination);src.start();src.stop(c.currentTime+dur);
    }catch(_){}
  }
  playRoll(){this._noise(0.14,0.22,400,1000);}
  playRotiDone(){
    this._tone(880,0.07,'sine',0.4);
    setTimeout(()=>this._tone(1320,0.12,'sine',0.35),90);
    setTimeout(()=>this._tone(1760,0.35,'sine',0.28),200);
  }
  playStart(){this._tone(523,0.1,'triangle',0.3);setTimeout(()=>this._tone(659,0.18,'triangle',0.28),130);}
  playWarning(){this._tone(440,0.12,'square',0.22);}
  playClick(){this._tone(600,0.07,'triangle',0.2);}
}

/* ── Input ──────────────────────────────────────────────────────────── */
class RotiInput{
  constructor(){
    this._blockStart=[-Infinity,-Infinity];this._blocked=[false,false];
    this._lastSensor=-1;this._transitions=0;
    this.onDirectionChange=null;this.onFullRoll=null;
    window.addEventListener('message',e=>{if(e.data?.type==='ir')this._onIR({s:e.data.s,v:e.data.v});});
    document.addEventListener('lb:ir',e=>{const d=e.detail;this._onIR({s:d.s??d.sensor,v:d.v??d.value});});
    window.addEventListener('keydown',e=>this._onKey(e));
  }
  _onIR({s,v}){
    const i=s-1,now=performance.now(),blocked=(v===0);
    if(blocked&&!this._blocked[i])this._blockStart[i]=now;
    else if(!blocked&&this._blocked[i]){if(now-this._blockStart[i]<2000)this._sensorPassed(i);}
    this._blocked[i]=blocked;
    [$('s1dot'),$('s2dot')].forEach((d,j)=>d?.classList.toggle('active',this._blocked[j]));
  }
  _sensorPassed(i){
    if(this._lastSensor===-1){this._lastSensor=i;return;}
    if(i===this._lastSensor)return;
    this._lastSensor=i;this._transitions++;
    this.onDirectionChange?.(i);
    if(this._transitions>=2){this._transitions=0;this.onFullRoll?.();}
  }
  _onKey(e){
    const k=e.key.toLowerCase();
    if(['arrowleft','a'].includes(k))this._sensorPassed(0);
    if(['arrowright','d'].includes(k))this._sensorPassed(1);
  }
  reset(){this._lastSensor=-1;this._transitions=0;}
}

/* ── Canvas resize ──────────────────────────────────────────────────── */
function resizeCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}

/* ── Kitchen background ─────────────────────────────────────────────── */
function drawKitchen(ctx,W,H){
  // wall gradient
  const wg=ctx.createLinearGradient(0,0,0,H*.72);
  wg.addColorStop(0,'#b83810');wg.addColorStop(0.5,'#8c2c08');wg.addColorStop(1,'#6a2008');
  ctx.fillStyle=wg;ctx.fillRect(0,0,W,H*.72);

  // subtle wall texture
  ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle='#000';ctx.lineWidth=1;
  for(let y=0;y<H*.72;y+=28){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+6);ctx.stroke();
  }
  ctx.restore();

  // dado shelf at 26% height
  const shelfY=H*.26;
  const sg=ctx.createLinearGradient(0,shelfY,0,shelfY+16);
  sg.addColorStop(0,'#8c5018');sg.addColorStop(1,'#5c2e08');
  ctx.fillStyle=sg;ctx.fillRect(0,shelfY,W,16);
  ctx.fillStyle='rgba(255,200,100,0.22)';ctx.fillRect(0,shelfY,W,3);

  // spice jars silhouettes on shelf
  const jars=[
    {x:.12,col:'#cc4422',h:.06},{x:.22,col:'#228844',h:.055},{x:.31,col:'#ddaa22',h:.065},
    {x:.68,col:'#882288',h:.055},{x:.78,col:'#cc4422',h:.06},{x:.87,col:'#228844',h:.05},
  ];
  jars.forEach(j=>{
    const jx=W*j.x,jy=shelfY-H*j.h,jw=W*.055,jh=H*j.h;
    ctx.fillStyle=j.col+'dd';
    ctx.beginPath();ctx.roundRect(jx-jw/2,jy,jw,jh,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.beginPath();ctx.roundRect(jx-jw/2+2,jy+3,jw*.35,jh*.45,2);ctx.fill();
    // lid
    ctx.fillStyle='#3a1800cc';
    ctx.beginPath();ctx.roundRect(jx-jw/2-1,jy-5,jw+2,7,2);ctx.fill();
  });

  // counter surface (where chakla sits)
  const ctrY=H*.62;
  const cg=ctx.createLinearGradient(0,ctrY,0,ctrY+H*.14);
  cg.addColorStop(0,'#c8a060');cg.addColorStop(0.4,'#a87840');cg.addColorStop(1,'#7a5020');
  ctx.fillStyle=cg;ctx.fillRect(0,ctrY,W,H*.14);
  // counter front edge
  ctx.fillStyle='#5a3010';ctx.fillRect(0,ctrY-3,W,5);
  ctx.fillStyle='rgba(255,210,120,0.2)';ctx.fillRect(0,ctrY-3,W,2);

  // floor gradient below counter
  const flr=ctx.createLinearGradient(0,ctrY+H*.14,0,H);
  flr.addColorStop(0,'#4a1e08');flr.addColorStop(1,'#280e02');
  ctx.fillStyle=flr;ctx.fillRect(0,ctrY+H*.14,W,H);

  // tile lines on counter
  ctx.save();ctx.globalAlpha=0.12;ctx.strokeStyle='#3a1800';ctx.lineWidth=1;
  for(let x=0;x<W;x+=W*.08){
    ctx.beginPath();ctx.moveTo(x,ctrY);ctx.lineTo(x,ctrY+H*.14);ctx.stroke();
  }
  ctx.restore();

  // flour dust static
  ctx.save();ctx.globalAlpha=0.05;ctx.fillStyle='#fff';
  for(let i=0;i<80;i++){
    const fx=(Math.sin(i*43.7)*.5+.5)*W,fy=(Math.cos(i*27.3)*.5+.5)*(H*.72);
    ctx.beginPath();ctx.arc(fx,fy,1+Math.abs(Math.sin(i)),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* ── Roti stack (right side) ────────────────────────────────────────── */
function drawRotiStack(ctx,W,H,count,emoji){
  if(count<=0)return;
  const stackX=W*.82, baseY=H*(DOUGH_CY_R+0.08);
  const maxShow=Math.min(count,8);
  // plate / thali
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(stackX+4,baseY+6,52,14,0,0,Math.PI*2);ctx.fill();
  const pg=ctx.createRadialGradient(stackX-12,baseY-4,4,stackX,baseY,52);
  pg.addColorStop(0,'#d8c080');pg.addColorStop(0.6,'#b09040');pg.addColorStop(1,'#7a6020');
  ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(stackX,baseY,52,13,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#9a7818';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(stackX,baseY,52,13,0,0,Math.PI*2);ctx.stroke();

  // stacked rotis
  for(let i=0;i<maxShow;i++){
    const ry=baseY-4-i*7;
    const rw=lerp(42,32,(i/7));
    const rh=lerp(11,8,(i/7));
    const alpha=lerp(0.75,1,(i/Math.max(maxShow-1,1)));
    ctx.globalAlpha=alpha;
    const dg=ctx.createRadialGradient(stackX-rw*.25,ry-rh*.3,rw*.05,stackX,ry,rw);
    const p=i/Math.max(maxShow-1,1);
    const light=`hsl(36,${65+p*15}%,${88-p*22}%)`;
    const dark =`hsl(32,${68+p*12}%,${55-p*18}%)`;
    dg.addColorStop(0,light);dg.addColorStop(1,dark);
    ctx.fillStyle=dg;
    ctx.beginPath();ctx.ellipse(stackX,ry,rw,rh,0,0,Math.PI*2);ctx.fill();
    // edge burn
    if(i>0){
      const eg=ctx.createRadialGradient(stackX,ry,rw*.5,stackX,ry,rw);
      eg.addColorStop(0,'rgba(0,0,0,0)');eg.addColorStop(1,`rgba(80,30,0,${p*.4})`);
      ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(stackX,ry,rw,rh,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // +N label if more than 8
  if(count>8){
    ctx.font='bold 11px system-ui';ctx.fillStyle='rgba(255,220,120,0.9)';
    ctx.textAlign='center';ctx.fillText(`+${count-8}`,stackX,baseY-8*7-8);
  }
  // count badge on plate
  ctx.font='bold 14px system-ui';ctx.fillStyle='#fff';
  ctx.textAlign='center';ctx.fillText(`${count}`,stackX,baseY+5);
}

/* ── Chakla ─────────────────────────────────────────────────────────── */
function drawChakla(ctx,cx,cy,r){
  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(cx+8,cy+10,r,r*.22,0,0,Math.PI*2);ctx.fill();
  // marble / stone gradient
  const g=ctx.createRadialGradient(cx-r*.35,cy-r*.3,r*.08,cx,cy,r);
  g.addColorStop(0,'#e8d8b8');g.addColorStop(0.5,'#c8a858');g.addColorStop(1,'#9a7030');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  // rim
  ctx.strokeStyle='#5a3408';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r-8,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=2;ctx.stroke();
  // grain lines
  ctx.save();ctx.globalAlpha=0.09;ctx.strokeStyle='#3a1800';ctx.lineWidth=1.2;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4,cr=r*.55;
    ctx.beginPath();ctx.moveTo(cx+cr*Math.cos(a),cy+cr*Math.sin(a));
    ctx.lineTo(cx+r*.88*Math.cos(a+.25),cy+r*.88*Math.sin(a+.25));ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}

/* ── Dough ──────────────────────────────────────────────────────────── */
function drawDough(ctx,cx,cy,progress,flashT){
  const p=clamp(progress,0,1),ep=easeOut(p);
  const r=lerp(24,105,ep);const sy=lerp(1.0,0.28,ep);
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();ctx.ellipse(5,8+r*sy*.4,r*.95,r*sy*.5,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
  const gr=ctx.createRadialGradient(-r*.28,-r*sy*.3,r*.04,0,0,r*1.08);
  const light=`hsl(38,${55+ep*20}%,${92-ep*14}%)`;
  const mid  =`hsl(36,${55+ep*20}%,${78-ep*12}%)`;
  const dark =`hsl(34,${58+ep*18}%,${52-ep*10}%)`;
  gr.addColorStop(0,light);gr.addColorStop(0.45,mid);gr.addColorStop(1,dark);
  ctx.beginPath();ctx.ellipse(0,0,r,r*sy,0,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
  if(ep>0.15){
    const eg=ctx.createRadialGradient(0,0,r*(0.55-ep*.15),0,0,r*1.02);
    eg.addColorStop(0,'rgba(0,0,0,0)');eg.addColorStop(1,`rgba(90,42,5,${ep*.32})`);
    ctx.beginPath();ctx.ellipse(0,0,r,r*sy,0,0,Math.PI*2);ctx.fillStyle=eg;ctx.fill();
  }
  if(ep>0.6){
    ctx.beginPath();ctx.ellipse(0,0,r*.12,r*.12*sy,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(120,65,10,${((ep-.6)/.4)*.4})`;ctx.fill();
  }
  if(flashT>0){
    ctx.beginPath();ctx.ellipse(0,0,r*1.12,r*sy*1.12,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,230,120,${flashT*.75})`;ctx.fill();
  }
  ctx.restore();
}

/* ── Belan ──────────────────────────────────────────────────────────── */
function drawBelan(ctx,cx,by,hW){
  const midH=21,endH=9,ei=endH;
  ctx.save();ctx.translate(cx,by);
  ctx.beginPath();
  ctx.moveTo(-hW+ei,-endH+5);
  ctx.bezierCurveTo(-hW*.3,-midH*.55+5,hW*.3,-midH*.55+5,hW-ei,-endH+5);
  ctx.arc(hW-ei,5,endH,-Math.PI/2,Math.PI/2);
  ctx.bezierCurveTo(hW*.3,midH*.55+5,-hW*.3,midH*.55+5,-hW+ei,endH+5);
  ctx.arc(-hW+ei,5,endH,Math.PI/2,-Math.PI/2);
  ctx.closePath();ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-hW+ei,-endH);
  ctx.bezierCurveTo(-hW*.28,-midH*1.18,hW*.28,-midH*1.18,hW-ei,-endH);
  ctx.arc(hW-ei,0,endH,-Math.PI/2,Math.PI/2);
  ctx.bezierCurveTo(hW*.28,midH*1.18,-hW*.28,midH*1.18,-hW+ei,endH);
  ctx.arc(-hW+ei,0,endH,Math.PI/2,-Math.PI/2);
  ctx.closePath();
  const gr=ctx.createLinearGradient(0,-midH,0,midH);
  gr.addColorStop(0,'#fff8ec');gr.addColorStop(0.18,'#ffe8a8');
  gr.addColorStop(0.62,'#c8a050');gr.addColorStop(1,'#8c6020');
  ctx.fillStyle=gr;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-hW*.52,-midH*.82);
  ctx.bezierCurveTo(-hW*.18,-midH*1.12,hW*.18,-midH*1.12,hW*.52,-midH*.82);
  ctx.strokeStyle='rgba(255,255,255,0.68)';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  for(const ex of[-hW+ei,hW-ei]){
    const cg=ctx.createRadialGradient(ex-2,-2,1,ex,0,endH+3);
    cg.addColorStop(0,'#b88030');cg.addColorStop(1,'#5a3408');
    ctx.beginPath();ctx.arc(ex,0,endH,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.restore();
}

/* ── Flour particles ────────────────────────────────────────────────── */
class FlourParticles{
  constructor(){this.pts=[];}
  puff(x,y,n=14){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=25+Math.random()*70;
      this.pts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,life:.5+Math.random()*.5,age:0,r:1.5+Math.random()*3});
    }
  }
  update(dt){
    for(let i=this.pts.length-1;i>=0;i--){
      const p=this.pts[i];p.age+=dt;
      if(p.age>=p.life){this.pts.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;
    }
  }
  draw(ctx){
    ctx.save();
    for(const p of this.pts){
      const a=(1-p.age/p.life)*.75;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,250,240,${a})`;ctx.fill();
    }
    ctx.restore();
  }
}

/* ── Steam particles ────────────────────────────────────────────────── */
class SteamParticles{
  constructor(){this.pts=[];}
  puff(x,y,n=6){
    for(let i=0;i<n;i++){
      this.pts.push({x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*14,vy:-(18+Math.random()*28),life:.8+Math.random()*.6,age:0,r:3+Math.random()*5});
    }
  }
  update(dt){
    for(let i=this.pts.length-1;i>=0;i--){
      const p=this.pts[i];p.age+=dt;
      if(p.age>=p.life){this.pts.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*4;
    }
  }
  draw(ctx){
    ctx.save();
    for(const p of this.pts){
      const a=(1-p.age/p.life)*.38;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,240,220,${a})`;ctx.fill();
    }
    ctx.restore();
  }
}

/* ── Chef IK (same as original) ─────────────────────────────────────── */
function computeElbow(sx,sy,tx,ty,L1,L2,elbowLeft){
  const dx=tx-sx,dy=ty-sy;
  const D=Math.min(Math.sqrt(dx*dx+dy*dy),L1+L2-.5);
  const ang=Math.atan2(dy,dx);
  const cosA=clamp((D*D+L1*L1-L2*L2)/(2*D*L1),-1,1);
  const a=Math.acos(cosA);
  const ea=elbowLeft?ang+a:ang-a;
  return[sx+L1*Math.cos(ea),sy+L1*Math.sin(ea)];
}
class ChefAnim{
  constructor(isBoy){this.isBoy=isBoy;this.lean=0;}
  onDir(dir){this.lean=dir>0?.04:-.06;}
  update(dt){this.lean*=Math.max(0,1-dt*5);}
}
function _chefLayout(H){
  return{headR:40,bodyH:96,bodyW:55,bodyY:Math.round(H*.30),shoulderOff:58,shoulderY:Math.round(H*.30)-Math.round(96*.28),L1:155,L2:135,endCapX:111};
}
function drawChefBody(ctx,W,H,chef){
  const isBoy=chef.isBoy,lean=chef.lean,cx=W/2;
  const{headR,bodyH,bodyW,bodyY,shoulderOff}=_chefLayout(H);
  const skin=isBoy?'#f0b98a':'#e8a87c',shirt=isBoy?'#5a9ef5':'#f07aba',hair='#241408',pants=isBoy?'#2c3e6b':'#b02060';
  ctx.save();ctx.translate(cx,bodyY);ctx.rotate(lean);ctx.translate(-cx,-bodyY);
  ctx.fillStyle=pants;
  ctx.beginPath();ctx.ellipse(cx-22,bodyY+30,32,13,-0.22,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+22,bodyY+37,32,13,0.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath();ctx.ellipse(cx-46,bodyY+38,16,10,-0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(cx+46,bodyY+45,16,10,0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=shirt;
  ctx.beginPath();ctx.ellipse(cx,bodyY,bodyW,bodyH,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=skin;
  ctx.beginPath();ctx.ellipse(cx,bodyY-bodyH+10,11,14,0,0,Math.PI*2);ctx.fill();
  const headY=bodyY-bodyH-headR+6;
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(cx,headY,headR+3,Math.PI,Math.PI*2);ctx.fill();
  if(!isBoy){
    ctx.beginPath();ctx.arc(cx,headY-headR-7,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(185,45,105,0.65)';
    ctx.beginPath();ctx.ellipse(cx-shoulderOff+5,bodyY-bodyH+13,18,12,-0.45,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+shoulderOff-5,bodyY-bodyH+13,18,12,0.45,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=hair;ctx.beginPath();ctx.arc(cx,headY,headR+3,Math.PI,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(cx,headY,headR,0,Math.PI*2);ctx.fill();
  const eyeY=headY-3;
  ctx.fillStyle='#1a0800';
  ctx.beginPath();ctx.arc(cx-9,eyeY,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+9,eyeY,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath();ctx.arc(cx-7,eyeY-2,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+11,eyeY-2,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hair;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-14,eyeY-8);ctx.lineTo(cx-5,eyeY-10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+14,eyeY-8);ctx.lineTo(cx+5,eyeY-10);ctx.stroke();
  ctx.strokeStyle='#7a3010';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,headY+9,7,.2,Math.PI-.2);ctx.stroke();
  ctx.restore();
}
function drawChefArms(ctx,W,H,belanY,isBoy){
  const cx=W/2,{shoulderOff,shoulderY,L1,L2,endCapX}=_chefLayout(H);
  const skin=isBoy?'#f0b98a':'#e8a87c';
  ctx.save();
  for(const side of[-1,1]){
    const sx=cx+side*shoulderOff,sy=shoulderY,tx=cx+side*endCapX,ty=belanY;
    const[ex,ey]=computeElbow(sx,sy,tx,ty,L1,L2,side<0);
    ctx.strokeStyle=skin;ctx.lineWidth=11;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.08)';ctx.beginPath();ctx.arc(ex,ey,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(tx+2,ty+4,16,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(tx,ty,16,12,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1.5;ctx.lineCap='round';
    for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(tx+k*5,ty-6,4,Math.PI+.3,Math.PI*2-.3);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,0.22)';ctx.beginPath();ctx.ellipse(tx-side*4,ty-3,8,5,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* ── RotiGame ───────────────────────────────────────────────────────── */
class RotiGame{
  constructor(canvas,audio,ir,cfg){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.audio=audio;this.ir=ir;
    this.chefName=cfg.chefName;this.rollsPerRoti=cfg.rollsPerRoti;
    this.rotiType=cfg.rotiType;this.totalTime=cfg.totalTime;
    this.rotiCount=0;this.currentRolls=0;this.timeLeft=cfg.totalTime;
    this.running=true;this.lastFrame=performance.now();this.flashT=0;
    this.belan={active:false,t:0,dir:1};
    this.flour=new FlourParticles();this.steam=new SteamParticles();
    this.chef=new ChefAnim(!!cfg.isBoy);this.warnedLow=false;
    this.ir.reset();
    this.ir.onDirectionChange=toSensor=>this._onDir(toSensor);
    this.ir.onFullRoll=()=>this._onFullRoll();
    this._loopBound=this._loop.bind(this);
    requestAnimationFrame(this._loopBound);
    audio.playStart();
    this._updateHUD();
  }
  _onDir(toSensor){
    if(!this.running)return;
    this.audio.playRoll();
    const W=this.canvas.clientWidth,H=this.canvas.clientHeight;
    this.flour.puff(W/2,H*DOUGH_CY_R,10);
    const dir=toSensor===1?1:-1;
    this.belan={active:true,t:0,dir};
    this.chef.onDir(dir);
  }
  _onFullRoll(){
    if(!this.running)return;
    this.currentRolls++;
    if(this.currentRolls>=this.rollsPerRoti){
      this.currentRolls=0;this.rotiCount++;this.flashT=1.0;
      this.audio.playRotiDone();
      const W=this.canvas.clientWidth,H=this.canvas.clientHeight;
      this.flour.puff(W/2,H*DOUGH_CY_R,28);
      this.steam.puff(W/2,H*(DOUGH_CY_R-.06),10);
      this._flyEmoji();
    }
    this._updateHUD();this._updateBar();
  }
  _flyEmoji(){
    const el=document.createElement('div');
    el.className='fly-roti';el.textContent=this.rotiType.emoji;
    el.style.left=`${35+Math.random()*30}%`;el.style.bottom='38%';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1300);
  }
  _updateHUD(){
    $('hudTimer').textContent=fmtTime(Math.ceil(this.timeLeft));
    $('hudTimer').classList.toggle('warn',this.timeLeft<=10);
    $('hudChef').textContent=this.chefName;
    $('hudRoti').textContent=`${this.rotiCount} ${this.rotiType.emoji}`;
  }
  _updateBar(){
    const pct=this.rollsPerRoti>0?(this.currentRolls/this.rollsPerRoti)*100:0;
    $('rollFill').style.width=`${pct}%`;
  }
  _loop(now){
    if(!this.running)return;
    const dt=Math.min((now-this.lastFrame)/1000,.1);
    this.lastFrame=now;this._update(dt);this._draw();
    requestAnimationFrame(this._loopBound);
  }
  _update(dt){
    this.timeLeft=Math.max(0,this.timeLeft-dt);
    if(this.timeLeft===0){this._end();return;}
    if(!this.warnedLow&&this.timeLeft<=10){this.warnedLow=true;this.audio.playWarning();}
    if(this.flashT>0)this.flashT=Math.max(0,this.flashT-dt*2.8);
    if(this.belan.active){this.belan.t+=dt/.38;if(this.belan.t>=1)this.belan.active=false;}
    this.flour.update(dt);this.steam.update(dt);this.chef.update(dt);
    this._updateHUD();
  }
  _draw(){
    const cv=this.canvas,ctx=this.ctx;
    const W=cv.clientWidth,H=cv.clientHeight;
    const cx=W/2,doughCY=H*DOUGH_CY_R,belanHW=120;
    let curBelanY=doughCY;
    if(this.belan.active){
      const t=easeOut(clamp(this.belan.t,0,1));
      curBelanY=this.belan.dir>0
        ?lerp(doughCY-BELAN_SPAN/2,doughCY+BELAN_SPAN/2,t)
        :lerp(doughCY+BELAN_SPAN/2,doughCY-BELAN_SPAN/2,t);
    }
    ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
    drawKitchen(ctx,W,H);
    drawChefBody(ctx,W,H,this.chef);
    drawChakla(ctx,cx,doughCY,120);
    const progress=this.rollsPerRoti>0?this.currentRolls/this.rollsPerRoti:0;
    drawDough(ctx,cx,doughCY,progress,this.flashT);
    drawBelan(ctx,cx,curBelanY,belanHW);
    drawChefArms(ctx,W,H,curBelanY,this.chef.isBoy);
    this.flour.draw(ctx);this.steam.draw(ctx);
    // progress arc
    const arcR=lerp(24,105,easeOut(progress))+18;
    if(progress>0){
      ctx.beginPath();ctx.arc(cx,doughCY,arcR,-Math.PI/2,-Math.PI/2+Math.PI*2*progress);
      ctx.strokeStyle=this.timeLeft<=10?'rgba(255,70,20,.8)':'rgba(255,200,60,.7)';
      ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();
    }
    drawRotiStack(ctx,W,H,this.rotiCount,this.rotiType.emoji);
  }
  _end(){
    this.running=false;this.ir.onDirectionChange=null;this.ir.onFullRoll=null;
    window.__ui?.showResult(this);
  }
  destroy(){this.running=false;this.ir.onDirectionChange=null;this.ir.onFullRoll=null;}
}

/* ── UIManager ──────────────────────────────────────────────────────── */
class UIManager{
  constructor(audio,ir){
    this.audio=audio;this.ir=ir;this.game=null;
    this._selType=0;this._selTime=60;this._selChar='girl';
    this._buildChefBtns();this._buildTypeBtns();this._buildTimerBtns();this._bind();
  }
  _buildChefBtns(){
    const row=$('chefBtns');
    [['girl','👧 Girl Chef'],['boy','👦 Boy Chef']].forEach(([c,l])=>{
      const b=document.createElement('button');b.className='btn sm';b.dataset.char=c;b.textContent=l;
      b.addEventListener('click',()=>{this.audio.playClick();this._selChar=c;row.querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel',x.dataset.char===c));});
      row.appendChild(b);
    });
    row.querySelector('.btn').classList.add('sel');
  }
  _buildTypeBtns(){
    const row=$('rotiTypeBtns');
    ROTI_TYPES.forEach((t,i)=>{
      const b=document.createElement('button');b.className='btn sm';b.dataset.ri=i;
      b.innerHTML=`${t.emoji} ${t.name}<br><small style="opacity:.7">${t.rolls||'?'} rolls</small>`;
      b.addEventListener('click',()=>{this.audio.playClick();this._selType=i;this._refreshTypeBtns();$('customRow').style.display=i===3?'block':'none';});
      row.appendChild(b);
    });
    this._refreshTypeBtns();
  }
  _refreshTypeBtns(){$('rotiTypeBtns').querySelectorAll('.btn').forEach((b,i)=>b.classList.toggle('sel',i===this._selType));}
  _buildTimerBtns(){
    const row=$('timerBtns');
    TIMER_OPTS.forEach(s=>{
      const b=document.createElement('button');b.className='btn sm';b.dataset.s=s;
      b.textContent=s<60?`${s}s`:`${s/60}m`;
      b.addEventListener('click',()=>{this.audio.playClick();this._selTime=s;this._refreshTimerBtns();});
      row.appendChild(b);
    });
    this._refreshTimerBtns();
  }
  _refreshTimerBtns(){$('timerBtns').querySelectorAll('.btn').forEach(b=>b.classList.toggle('sel',+b.dataset.s===this._selTime));}
  _rollsForType(){
    if(this._selType===3)return clamp(parseInt($('customRolls').value)||5,1,99);
    return ROTI_TYPES[this._selType].rolls;
  }
  _bind(){
    $('bleBtn').addEventListener('click',async()=>{this.audio.ensureCtx();const ok=await doConnectBLE(s=>$('conStatus').textContent=s);if(ok)this._goSetup();});
    $('wsBtn' ).addEventListener('click',async()=>{this.audio.ensureCtx();const ok=await doConnectWS (s=>$('conStatus').textContent=s);if(ok)this._goSetup();});
    $('kbBtn' ).addEventListener('click',()=>{this.audio.ensureCtx();this._goSetup();});
    $('startBtn'   ).addEventListener('click',()=>this._startGame());
    $('resAgainBtn').addEventListener('click',()=>{this.audio.playClick();$('scr-result').classList.add('hidden');this._goSetup();});
    $('resHomeBtn' ).addEventListener('click',()=>{this.audio.playClick();$('scr-result').classList.add('hidden');this._goSetup();});
  }
  _goSetup(){
    $('scr-connect').classList.add('hidden');$('scr-result').classList.add('hidden');
    $('scr-setup').classList.remove('hidden');
    this._refreshTypeBtns();this._refreshTimerBtns();
  }
  _startGame(){
    this.audio.playClick();
    const name=$('chefName').value.trim()||'Little Chef';
    const rolls=this._rollsForType();
    const cfg={chefName:name,rollsPerRoti:rolls,rotiType:ROTI_TYPES[this._selType],totalTime:this._selTime,isBoy:this._selChar==='boy'};
    $('scr-setup').classList.add('hidden');
    $('hud').classList.remove('hidden');$('rollBar').classList.remove('hidden');$('sensorHUD').classList.remove('hidden');
    resizeCanvas($('gc'));
    if(this.game)this.game.destroy();
    this.game=new RotiGame($('gc'),this.audio,this.ir,cfg);
  }
  showResult(g){
    $('hud').classList.add('hidden');$('rollBar').classList.add('hidden');$('sensorHUD').classList.add('hidden');
    const mins=g.totalTime/60;
    const rate=g.rotiCount>0?(g.rotiCount/mins).toFixed(1):0;
    $('resTitle').textContent=g.rotiCount===0?'Keep Practising!':g.rotiCount>=5?'Amazing Chef! 🏆':'Great Work!';
    $('resEmoji').textContent=g.rotiCount===0?'😊':g.rotiCount>=5?'🏆':'🌟';
    $('resStars').textContent=g.rotiCount>=6?'⭐⭐⭐':g.rotiCount>=3?'⭐⭐':g.rotiCount>=1?'⭐':'';
    $('resCount').textContent=`${g.rotiCount} ${g.rotiType.emoji}`;
    $('resType').textContent=`${g.rotiType.name} · ${g.rollsPerRoti} rolls each`;
    $('resSub').textContent=g.rotiCount>0?`${rate} rotis/min — great cooking! 🌟`:`Keep rolling, Chef! You'll get it! 💪`;
    $('rotiIcons').textContent=g.rotiType.emoji.repeat(Math.min(g.rotiCount,12));
    $('scr-result').classList.remove('hidden');
  }
}

/* ── Connection ─────────────────────────────────────────────────────── */
const _dec=v=>new TextDecoder().decode(v);
async function doConnectBLE(status){
  try{
    status('Scanning…');
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'LearnBuddy'}],optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb']});
    status('Connecting…');
    const srv=await dev.gatt.connect();
    const svc=await srv.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');
    const ch=await svc.getCharacteristic('0000ff09-0000-1000-8000-00805f9b34fb');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>{try{const d=JSON.parse(_dec(e.target.value));document.dispatchEvent(new CustomEvent('lb:ir',{detail:{s:d.s,v:d.v}}));}catch(_){}});
    status('Connected ✓');return true;
  }catch(e){status(`Error: ${e.message}`);return false;}
}
async function doConnectWS(status){
  return new Promise(res=>{
    const host=prompt('ESP32 IP or hostname:','learnbuddy.local');
    if(!host){res(false);return;}
    status('Connecting…');
    const ws=new WebSocket(`ws://${host}/ws`);
    ws.onopen=()=>{status('Connected ✓');res(true);};
    ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='ir')document.dispatchEvent(new CustomEvent('lb:ir',{detail:{s:d.s,v:d.v}}));}catch(_){}};
    ws.onerror=()=>{status('Connection failed');res(false);};
  });
}

window.addEventListener('DOMContentLoaded',()=>{
  resizeCanvas($('gc'));
  window.addEventListener('resize',()=>resizeCanvas($('gc')));
  const audio=new AudioManager(),ir=new RotiInput(),ui=new UIManager(audio,ir);
  window.__ui=ui;
  if(window.opener)ui._goSetup();
});
</script>
